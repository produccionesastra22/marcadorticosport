<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(760px,94vw);margin:auto;padding:35px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}.title{font-size:38px;font-weight:900}.sub,.small{color:#8e98aa;font-size:11px}
input{width:100%;height:44px;background:#090c11;color:#fff;border:1px solid #303848;border-radius:10px;padding:8px;font-size:15px}
button{height:44px;border:0;border-radius:10px;background:#4b82ff;color:#fff;font-weight:800;cursor:pointer;font-size:14px}
button.secondary{background:#252c39}button.danger{background:#7b2938}button:disabled{opacity:.35;cursor:not-allowed}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.stat{background:#0d1119;border:1px solid #252b38;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:28px}
.row{display:flex;gap:7px;margin-top:9px}.row>*{flex:1}
.banner{border-radius:14px;padding:16px;margin-bottom:14px;font-weight:900;font-size:17px;text-align:center;background:#141b28;border:1px solid #253049;color:#9cb3ff;transition:.2s}
.banner.win{background:#123625;border-color:#35d07f;color:#8dfbc2}
.bigactions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.big{height:96px;font-size:24px;border-radius:18px;letter-spacing:.5px}
.big.goal{background:#1a5c3c;border:3px solid #35d07f;color:#fff}
.big.goal:active{background:#217048}
.big.miss{background:#5c2230;border:3px solid #e95467;color:#fff}
.big.miss:active{background:#702b39}
.history{margin-top:4px}
.histrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.histrow>span:first-child{width:90px;font-weight:800;font-size:12px;color:#9aa5b8;flex-shrink:0}
.histrow>div{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:9px;background:#141b28;border:2px solid #2a3345;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#7c879b}
.dot.goal{background:#236d4c;border-color:#35d07f;color:#fff}
.dot.miss{background:#702b39;border-color:#e95467;color:#fff}
@media(max-width:700px){.title{font-size:28px}.big{height:100px;font-size:22px}}
.login{position:fixed;inset:0;background:#070a10;display:none;align-items:center;justify-content:center}.loginbox{width:340px;background:#141923;border:1px solid #252b38;border-radius:18px;padding:22px}.loginbox input{margin:5px 0}.loginbox button{width:100%;margin-top:8px}
</style></head><body><div class="wrap" id="app">
<div class="top"><div><div class="title">Modo penales</div><div class="sub">Tocá GOL o FALLÓ para el equipo que tira — el turno se calcula solo</div></div><button class="secondary" id="back">← Marcador</button></div>
<div class="banner" id="banner">Cargando…</div>
<div class="teams"><input id="team1" placeholder="LOCAL"><input id="team2" placeholder="VISITANTE"></div>
<div class="summary"><div class="stat"><b id="score1">0</b><span>Local</span></div><div class="stat"><b id="rounds">0</b><span>Lanzamientos</span></div><div class="stat"><b id="score2">0</b><span>Visitante</span></div></div>
<div class="bigactions"><button class="big goal" id="btnGoal">✓ GOL</button><button class="big miss" id="btnMiss">✕ FALLÓ</button></div>
<div class="row"><button class="secondary" id="undo">↺ Deshacer último</button><button class="danger" id="reset">↺ Reiniciar tanda</button></div>
<div class="history"><div class="histrow"><span id="title1">LOCAL</span><div id="hist1"></div></div><div class="histrow"><span id="title2">VISITANTE</span><div id="hist2"></div></div></div>
<div class="row" style="margin-top:16px"><button id="overlay">📺 Abrir overlay de penales</button><button class="secondary" id="copy">Copiar link OBS</button></div>
<input id="link" readonly style="margin-top:8px;width:100%">
</div><div class="login" id="login"><div class="loginbox"><h2>Control de penales</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn">Entrar</button></div></div>
<script>
// ASTRA · Firebase bootstrap
(() => {
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",
    authDomain: "astraprods.firebaseapp.com",
    databaseURL: "https://astraprods-default-rtdb.firebaseio.com",
    projectId: "astraprods"
  };
  const defaults = {
    team1Name: "LOCAL", team2Name: "VISITANTE",
    team1Logo: "", team2Logo: "", score1: 0, score2: 0,
    timer: {phase:"first",baseSeconds:0,running:false,startedAt:0,extraMinutes:0,extraActive:false,extraStartSeconds:0},
    penalties: {active:false,team1Name:"LOCAL",team2Name:"VISITANTE",kicks1:[null,null,null,null,null],kicks2:[null,null,null,null,null],visibleKicks:5},
    layout: {}
  };
  const params = new URLSearchParams(location.search);
  const matchId = params.get("match") || "default";
  if (!window.firebase) throw new Error("Firebase SDK no cargado.");
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.database();
  const ref = db.ref("marcadorSimple/" + matchId);
  let state = JSON.parse(JSON.stringify(defaults));
  const $ = id => document.getElementById(id);
  const save = patch => ref.update(patch).catch(e=>{console.error(e);alert(e.code||"Error de Firebase");throw e});
  let listening=false;
  function startListen(){if(listening)return;listening=true;ref.on("value",snap=>{const d=snap.val()||{};state={...defaults,...d,timer:{...defaults.timer,...(d.timer||{})},penalties:{...defaults.penalties,...(d.penalties||{})}};if(window.renderApp)window.renderApp()},err=>{console.error(err);alert(err.code==="PERMISSION_DENIED"?"Firebase rechazó el acceso a este UUID.":err.message);});}
  window.ASTRA = { $, db, auth, ref, defaults, save, startListen, getState: () => state };
})();
</script><script>
const auth=window.ASTRA.auth,save=window.ASTRA.save,defaultsA=window.ASTRA.defaults;
let lastAction=null; // {key,i} para "deshacer"

// Determina si la serie ya está decidida (ganador matemático o rondas iguales con marcador distinto)
function winner(a,b,v){
  const taken=arr=>arr.filter(x=>x!=null).length;
  const goals=arr=>arr.filter(x=>x==="goal").length;
  const t1=taken(a),t2=taken(b),g1=goals(a),g2=goals(b);
  const remain1=Math.max(0,v-t1),remain2=Math.max(0,v-t2);
  if(g1>g2+remain2) return 1;
  if(g2>g1+remain1) return 2;
  if(t1>=v&&t2>=v&&t1===t2&&g1!==g2) return g1>g2?1:2;
  return 0;
}

function renderApp(){
  const s=window.ASTRA.getState(),p={...defaultsA.penalties,...(s.penalties||{})},v=Math.max(5,Math.min(10,Number(p.visibleKicks)||5)),a=Array.isArray(p.kicks1)?p.kicks1:[],b=Array.isArray(p.kicks2)?p.kicks2:[];
  $("team1").value=p.team1Name||s.team1Name||"LOCAL";$("team2").value=p.team2Name||s.team2Name||"VISITANTE";$("title1").textContent=$("team1").value;$("title2").textContent=$("team2").value;
  $("score1").textContent=a.filter(x=>x==="goal").length;$("score2").textContent=b.filter(x=>x==="goal").length;$("rounds").textContent=Math.max(a.filter(Boolean).length,b.filter(Boolean).length);
  const taken1=a.slice(0,v).filter(Boolean).length,taken2=b.slice(0,v).filter(Boolean).length;
  const teamTurn=taken1<=taken2?1:2;
  const w=winner(a,b,v);

  const banner=$("banner");
  if(w){
    banner.className="banner win";
    banner.textContent="🏆 Serie decidida: gana "+(w===1?$("team1").value:$("team2").value);
  } else {
    banner.className="banner";
    banner.textContent=`Turno de ${teamTurn===1?$("team1").value:$("team2").value} · lanzamiento #${Math.max(taken1,taken2)+1}`;
  }
  $("btnGoal").disabled=!!w;$("btnMiss").disabled=!!w;

  const drawHist=(id,arr)=>{$(id).innerHTML=Array.from({length:v},(_,i)=>{const x=arr[i],cls=x==="goal"?"goal":x==="miss"?"miss":"",m=x==="goal"?"✓":x==="miss"?"✕":(i+1);return `<div class="dot ${cls}">${m}</div>`}).join("")};
  drawHist("hist1",a);drawHist("hist2",b);
  $("undo").disabled=!lastAction;
}

function applyResult(val){
  const s=window.ASTRA.getState(),p={...defaultsA.penalties,...(s.penalties||{})};
  let v=Math.max(5,Math.min(10,Number(p.visibleKicks)||5));
  let a=[...(Array.isArray(p.kicks1)?p.kicks1:[])],b=[...(Array.isArray(p.kicks2)?p.kicks2:[])];
  while(a.length<v)a.push(null);while(b.length<v)b.push(null);
  if(winner(a,b,v))return;
  const taken1=a.slice(0,v).filter(Boolean).length,taken2=b.slice(0,v).filter(Boolean).length;
  const teamTurn=taken1<=taken2?1:2;
  let arr=teamTurn===1?a:b,key=teamTurn===1?"kicks1":"kicks2";
  let idx=arr.slice(0,v).findIndex(x=>!x);
  const patch={};
  if(idx===-1&&v<10){ v=v+1; patch["penalties/visibleKicks"]=v; while(arr.length<v)arr.push(null); idx=v-1; }
  if(idx===-1)return; // límite de 10 lanzamientos alcanzado
  arr[idx]=val;
  patch["penalties/"+key]=arr;
  lastAction={key,i:idx};
  save(patch);
}
$("btnGoal").onclick=()=>applyResult("goal");
$("btnMiss").onclick=()=>applyResult("miss");
$("undo").onclick=()=>{
  if(!lastAction)return;
  const cur=window.ASTRA.getState();const arr=[...(Array.isArray(cur.penalties?.[lastAction.key])?cur.penalties[lastAction.key]:[])];
  arr[lastAction.i]=null;
  save({["penalties/"+lastAction.key]:arr});
  lastAction=null;
};
$("team1").onchange=e=>save({"penalties/team1Name":e.target.value.trim()||"LOCAL"});$("team2").onchange=e=>save({"penalties/team2Name":e.target.value.trim()||"VISITANTE"});
$("reset").onclick=()=>{const s=window.ASTRA.getState();lastAction=null;save({penalties:{...defaultsA.penalties,team1Name:s.team1Name||"LOCAL",team2Name:s.team2Name||"VISITANTE"}})};
const match=new URLSearchParams(location.search).get("match")||"default",overlayUrl=()=>new URL("overlays/penales.html?match="+encodeURIComponent(match),location.href).href;
$("link").value=overlayUrl();$("copy").onclick=()=>navigator.clipboard?.writeText($("link").value);$("overlay").onclick=()=>location.href=overlayUrl();
$("back").onclick=()=>location.href="control.html?match="+encodeURIComponent(match);
$("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){console.error(e);alert(e.code||"No se pudo iniciar sesión.");}};
auth.onAuthStateChanged(u=>{$("login").style.display=u?"none":"flex";if(u)window.ASTRA.startListen();});
window.renderApp=renderApp;
</script></body></html>
