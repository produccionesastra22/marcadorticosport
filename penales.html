<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASTRA · Penales</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/firebase.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080b11;color:#f7f9fc;font-family:Inter,system-ui,sans-serif}body{min-height:100vh}.wrap{width:min(1080px,96vw);margin:auto;padding:14px 0 26px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.eyebrow{font-size:8px;letter-spacing:2px;color:#7395df;font-weight:900}.title{font:900 23px/1.05 Montserrat,Inter,sans-serif;margin-top:3px}.sub{font-size:9px;color:#748198;margin-top:4px}.btn{height:36px;border:0;border-radius:9px;padding:0 12px;background:#4e7fff;color:white;font-weight:900;font-size:10px;cursor:pointer}.btn.secondary{background:#1a2130;color:#cbd4e2}.btn.goal{background:#19744e}.btn.miss{background:#792f40}.btn.undo{background:#252d3b}.card{background:#10151e;border:1px solid #242d3b;border-radius:14px;padding:12px}.hero{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.team{text-align:center}.team input{width:100%;height:34px;border:1px solid #2a3444;border-radius:8px;background:#090d14;color:#fff;text-align:center;font-weight:800;padding:0 8px;outline:0}.team input:focus{border-color:#4e7fff}.bigscore{font:900 42px/1 Montserrat;margin-top:8px}.vs{font-size:9px;font-weight:900;color:#59667a}.turn{margin-top:10px;background:#0b1017;border:1px solid #253044;border-radius:10px;padding:10px;text-align:center}.turn .label{font-size:8px;letter-spacing:1.5px;color:#7f8ca0;text-transform:uppercase}.turn strong{display:block;font:900 18px Montserrat;margin-top:3px}.turn small{display:block;color:#77849a;font-size:8px;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.actions .btn{height:42px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.head h2{margin:0;font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:#aeb9ca}.count{font-size:8px;color:#69768b}.kicks{display:grid;gap:5px}.kick{display:grid;grid-template-columns:28px 1fr 86px;align-items:center;gap:7px;padding:6px;border:1px solid #202a38;border-radius:9px;background:#0b1017}.kick.current{border-color:#4e7fff;box-shadow:0 0 0 1px #4e7fff22}.num{font-size:9px;font-weight:900;color:#69768b;text-align:center}.status{font-size:9px;font-weight:900}.status.pending{color:#77849a}.status.goal{color:#48d38d}.status.miss{color:#ff7184}.mini{display:flex;gap:4px}.mini button{width:26px;height:28px;border:0;border-radius:7px;color:#fff;font-weight:900;cursor:pointer}.footer-actions{display:flex;gap:7px;margin-top:10px}.footer-actions>*{flex:1}.login{position:fixed;inset:0;background:#05070cee;display:none;place-items:center;padding:15px;z-index:20}.loginbox{width:min(350px,100%);background:#111721;border:1px solid #293344;border-radius:16px;padding:18px}.loginbox h2{margin:0;font:900 18px Montserrat}.loginbox p{font-size:9px;color:#7b889c}.loginbox input{width:100%;height:38px;margin-top:7px;border:1px solid #2b3545;border-radius:8px;background:#090d14;color:#fff;padding:0 9px}.loginbox .btn{width:100%;margin-top:7px}.error{display:none;color:#ff7184;font-size:9px;margin-top:7px}@media(max-width:700px){.hero,.grid{grid-template-columns:1fr}.vs{display:none}.top .btn{display:none}}
</style></head><body>
<div class="wrap">
  <header class="top"><div><div class="eyebrow">ASTRA · SHOOTOUT CONTROL</div><div class="title">Tanda de penales</div><div class="sub">El sistema marca automáticamente de quién es el siguiente lanzamiento.</div></div><button class="btn secondary" id="back">← Marcador</button></header>
  <section class="card hero">
    <div class="team"><input id="team1" placeholder="LOCAL"><div class="bigscore" id="score1">0</div></div><div class="vs">VS</div><div class="team"><input id="team2" placeholder="VISITANTE"><div class="bigscore" id="score2">0</div></div>
  </section>
  <section class="card turn"><div class="label">Siguiente lanzamiento</div><strong id="nextTeam">LOCAL</strong><small id="turnHint">Lanzamiento 1 · serie inicial</small><div class="actions"><button class="btn goal" id="quickGoal">✓ GOL</button><button class="btn miss" id="quickMiss">× FALLÓ</button><button class="btn undo" id="undo">↶ DESHACER</button></div></section>
  <div class="grid"><section class="card"><div class="head"><h2 id="title1">LOCAL</h2><span class="count" id="count1">0/5</span></div><div class="kicks" id="kicks1"></div></section><section class="card"><div class="head"><h2 id="title2">VISITANTE</h2><span class="count" id="count2">0/5</span></div><div class="kicks" id="kicks2"></div></section></div>
  <div class="footer-actions"><button class="btn secondary" id="add">+ Añadir ronda</button><button class="btn danger" id="reset">↺ Nueva tanda</button><button class="btn" id="overlay">📺 Abrir overlay</button><button class="btn secondary" id="copy">Copiar link OBS</button></div>
  <input id="link" readonly style="width:100%;height:30px;margin-top:7px;border:1px solid #252e3c;border-radius:8px;background:#090d14;color:#8490a3;padding:0 8px;font-size:8px">
</div>
<div class="login" id="login"><div class="loginbox"><h2>ASTRA · Penales</h2><p>Iniciá sesión para controlar la tanda.</p><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button class="btn" id="loginBtn">Entrar</button><div class="error" id="error"></div></div></div>
<script>
const $=window.ASTRA.$, auth=window.ASTRA.auth, save=window.ASTRA.save, defaults=window.ASTRA.defaults;
const match=new URLSearchParams(location.search).get("match")||"default";
const overlayUrl=()=>new URL("overlays/penales.html?match="+encodeURIComponent(match),location.href).href;
function data(){const s=window.ASTRA.getState(),p={...defaults.penalties,...(s.penalties||{})};p.kicks1=Array.isArray(p.kicks1)?p.kicks1:[];p.kicks2=Array.isArray(p.kicks2)?p.kicks2:[];p.visibleKicks=Math.max(5,Math.min(10,Number(p.visibleKicks)||5));return {s,p}}
function nextTurn(p){
  const a=p.kicks1,b=p.kicks2,total=a.filter(Boolean).length+b.filter(Boolean).length;
  const target=total%2===0?0:1;
  const round=Math.floor(total/2)+1;
  return {target,round,total};
}
function renderApp(){
 const {s,p}=data(), n=nextTurn(p), v=p.visibleKicks;
 if(document.activeElement!==$("team1")) $("team1").value=p.team1Name||s.team1Name||"LOCAL"; if(document.activeElement!==$("team2")) $("team2").value=p.team2Name||s.team2Name||"VISITANTE";
 $("title1").textContent=$("team1").value;$("title2").textContent=$("team2").value;
 const a=p.kicks1,b=p.kicks2, g1=a.filter(x=>x==='goal').length,g2=b.filter(x=>x==='goal').length;
 $("score1").textContent=g1;$("score2").textContent=g2;$("count1").textContent=`${a.filter(Boolean).length}/${v}`;$("count2").textContent=`${b.filter(Boolean).length}/${v}`;
 const nextName=n.target===0?$("team1").value:$("team2").value;$("nextTeam").textContent=nextName;
 $("turnHint").textContent=`Lanzamiento ${n.round} · ${n.total<10?"serie inicial":"muerte súbita"}`;
 draw("kicks1",a,0,v);draw("kicks2",b,1,v);
}
function draw(id,arr,team,v){
 $(id).innerHTML=Array.from({length:v},(_,i)=>{const x=arr[i],cl=x||'pending',txt=x==='goal'?'GOL':x==='miss'?'FALLÓ':'Pendiente',current=nextTurn(data().p).target===team&&nextTurn(data().p).round===i+1&& !x?' current':'';return `<div class="kick${current}"><div class="num">${i+1}</div><div class="status ${cl}">${txt}</div><div class="mini"><button class="btn goal" data-team="${team}" data-i="${i}" data-v="goal">✓</button><button class="btn miss" data-team="${team}" data-i="${i}" data-v="miss">×</button><button class="btn secondary" data-team="${team}" data-i="${i}" data-v="clear">—</button></div></div>`}).join('');
 $(id).querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>setKick(Number(b.dataset.team),Number(b.dataset.i),b.dataset.v));
}
async function setKick(team,i,value){const {p}=data(),key=team===0?'kicks1':'kicks2',arr=[...(p[key]||[])];while(arr.length<p.visibleKicks)arr.push(null);arr[i]=value==='clear'?null:value;try{await save({['penalties/'+key]:arr});}catch(e){console.error(e);alert('Firebase rechazó el cambio. Revisá las Rules.')}}
function quick(value){const {p}=data(),n=nextTurn(p),key=n.target===0?'kicks1':'kicks2';return setKick(n.target,n.round-1,value)}
$("quickGoal").onclick=()=>quick('goal');$("quickMiss").onclick=()=>quick('miss');
$("undo").onclick=async()=>{const {p}=data(),n=nextTurn(p);let total=n.total;if(!total)return;const idx=total-1,team=idx%2===0?0:1,key=team===0?'kicks1':'kicks2',arr=[...(p[key]||[])];arr[Math.floor(idx/2)]=null;try{await save({['penalties/'+key]:arr})}catch(e){console.error(e)}};
$("add").onclick=()=>{const p=data().p;save({'penalties/visibleKicks':Math.min(10,p.visibleKicks+1)})};
$("reset").onclick=()=>{const s=window.ASTRA.getState();save({penalties:{...defaults.penalties,team1Name:s.team1Name||'LOCAL',team2Name:s.team2Name||'VISITANTE'}})};
$("team1").onchange=e=>save({'penalties/team1Name':e.target.value.trim()||'LOCAL'});$("team2").onchange=e=>save({'penalties/team2Name':e.target.value.trim()||'VISITANTE'});
$("overlay").onclick=()=>location.href=overlayUrl();$("link").value=overlayUrl();$("copy").onclick=()=>{navigator.clipboard?.writeText($("link").value)};$("back").onclick=()=>location.href='control.html?match='+encodeURIComponent(match);
$("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);$("error").style.display='none'}catch(e){$("error").textContent='No se pudo iniciar sesión.';$("error").style.display='block'}};
auth.onAuthStateChanged(u=>$("login").style.display=u?'none':'grid');
window.renderApp=renderApp;renderApp();
</script></body></html>
