<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRA · Voleibol</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b10;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}.wrap{width:min(960px,calc(94vw - 64px));margin:auto;padding:28px 0}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}.eyebrow{font-size:9px;letter-spacing:2px;color:#55a7ff;font-weight:900}.title{font:900 clamp(28px,5vw,42px)/1 Montserrat,Inter,sans-serif;letter-spacing:-1px;margin-top:6px}.sub{font-size:11px;color:#8b99aa;margin-top:7px}.card{background:linear-gradient(145deg,#121c28,#0d151e);border:1px solid #2a4056;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 18px 50px #0004}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.teams input{width:100%;height:42px;background:#0b121b;color:#fff;border:1px solid #30465d;border-radius:8px;padding:0 10px;font-weight:800}.score-card{padding:18px}.score-board{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:center;margin-top:18px}.team{text-align:center}.team-name{font-size:12px;color:#b7c5d3;font-weight:900;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.points{font:900 clamp(58px,10vw,92px)/.9 Montserrat;color:#fff;margin:8px 0;font-variant-numeric:tabular-nums}.sets{display:flex;justify-content:center;gap:6px}.sets span{min-width:32px;padding:7px 6px;border-radius:7px;background:#1a2635;border:1px solid #33495e;color:#aebdca;font-weight:900;font-size:14px}.sets span.won{background:#176b55;border-color:#31d39a;color:#fff}.vs{text-align:center;font-size:11px;font-weight:900;color:#60778e}.serve{font-size:9px;color:#ffcf67;min-height:14px;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.actions button{height:48px;border:0;border-radius:9px;background:#2e7fe0;color:#fff;font-weight:900;font-size:13px;cursor:pointer}.actions button:last-child{background:#d25366}.actions button:hover{filter:brightness(1.12)}.status{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#8fa4b7;margin-top:12px;padding-top:10px;border-top:1px solid #263b50}.status strong{color:#31d39a}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:140px;height:40px;border-radius:8px;border:1px solid #30465d;background:#192738;color:#e9f1f7;font-weight:800;cursor:pointer}.toolbar button.primary{background:#2e7fe0;border-color:#55a7ff}.toolbar button.danger{background:#713241;border-color:#a84d5d}.link{display:flex;gap:7px;margin-top:9px}.link input{flex:1;min-width:0;height:36px;background:#0b121b;color:#a9bac9;border:1px solid #2c4054;border-radius:8px;padding:0 9px;font-size:10px}.login{position:fixed;inset:0;display:none;place-items:center;background:#06090eec;z-index:50;padding:18px}.loginbox{width:min(360px,100%);padding:22px;border:1px solid #2a4056;border-radius:14px;background:#111b27}.loginbox input{width:100%;height:40px;margin:5px 0;background:#0b121b;color:#fff;border:1px solid #30465d;border-radius:8px;padding:0 9px}.loginbox button{width:100%;height:40px;margin-top:8px;border:0;border-radius:8px;background:#2e7fe0;color:#fff;font-weight:900}.error{font-size:10px;color:#ff7184;margin-top:8px}@media(max-width:700px){.wrap{width:94vw;padding-bottom:76px}.top{flex-direction:column}.top button{width:100%}.score-board{grid-template-columns:1fr 45px 1fr;gap:5px}.team-name{font-size:10px}.points{font-size:58px}}
</style>
<link rel="stylesheet" href="assets/theme.css?v=20260918-3">
<style>.set-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.set-control{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:#0b121b;border:1px solid #243549;border-radius:9px}.set-control span{font-size:9px;color:#8fa4b7;font-weight:900;letter-spacing:1px;text-transform:uppercase}.set-control div{display:flex;gap:5px}.set-control button{width:30px;height:28px;border:1px solid #344b61;border-radius:6px;background:#1a2a3b;color:#fff;font-weight:900;cursor:pointer}.set-control button:hover{background:#2e7fe0}@media(max-width:700px){.set-controls{grid-template-columns:1fr}}</style>
</head>
<body class="has-module-rail">
<aside class="module-rail" aria-label="Módulos ASTRA">
<a class="rail-brand" data-route="control.html" href="#" title="Control ASTRA">A</a><a data-route="control.html" href="#" title="Fútbol">⚽</a><a data-route="voleibol.html" class="active" href="#" title="Voleibol">🏐</a><a data-route="penales.html" href="#" title="Penales">🥅</a><a data-route="alineaciones.html" href="#" title="Alineaciones">🧾</a><a data-route="rotulo.html" href="#" title="Rótulo">🏷️</a><a data-route="noticias.html" href="#" title="Noticias">📰</a><span class="rail-spacer"></span>
</aside>
<script>const moduleMatch=encodeURIComponent(new URLSearchParams(location.search).get("match")||"default");document.querySelectorAll(".module-rail [data-route]").forEach(a=>a.href=a.dataset.route+"?match="+moduleMatch);</script>
<main class="wrap">
<header class="top"><div><div class="eyebrow">ASTRA PRODS · LIVE VOLLEYBALL</div><div class="title">Control de voleibol</div><div class="sub">Marcador por sets para transmisión en vivo · al mejor de 5</div></div><button class="toolbar" id="back">← Control fútbol</button></header>
<section class="card score-card">
<div class="teams"><input id="teamA" placeholder="LOCAL"><input id="teamB" placeholder="VISITANTE"></div>
<div class="score-board"><div class="team"><div class="team-name" id="nameA">LOCAL</div><div class="points" id="pointsA">0</div><div class="sets" id="setsA"></div><div class="serve" id="serveA"></div></div><div class="vs">SET<br><b id="setNumber">1</b></div><div class="team"><div class="team-name" id="nameB">VISITANTE</div><div class="points" id="pointsB">0</div><div class="sets" id="setsB"></div><div class="serve" id="serveB"></div></div></div>
<div class="actions"><button id="pointA">+ Punto local</button><button id="pointB">+ Punto visitante</button></div><div class="status"><span id="gameStatus">Listo para comenzar</span><strong id="connection">Conectando…</strong></div>
</section>
<section class="card"><div class="set-controls"><div class="set-control"><span>Sets local</span><div><button id="setAMinus" aria-label="Restar set local">−</button><button id="setAPlus" aria-label="Sumar set local">+</button></div></div><div class="set-control"><span>Sets visitante</span><div><button id="setBMinus" aria-label="Restar set visitante">−</button><button id="setBPlus" aria-label="Sumar set visitante">+</button></div></div></div><div class="toolbar"><button id="serveAButton">Saque local</button><button id="serveBButton">Saque visitante</button><button id="undo">↶ Deshacer punto</button><button class="danger" id="reset">Reiniciar partido</button></div></section>
<section class="card"><div class="toolbar"><button class="primary" id="overlay">↗ Abrir overlay voleibol</button><button id="copy">Copiar link OBS</button></div><div class="link"><input id="link" readonly></div></section>
</main>
<div class="login" id="login"><div class="loginbox"><h2>Acceso voleibol</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn">Entrar</button><div class="error" id="error"></div></div></div>
<script>
(()=>{
const C={apiKey:"AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",authDomain:"astraprods.firebaseapp.com",databaseURL:"https://astraprods-default-rtdb.firebaseio.com",projectId:"astraprods"};if(!firebase.apps.length)firebase.initializeApp(C);
const auth=firebase.auth(),db=firebase.database(),match=new URLSearchParams(location.search).get("match")||"default",ref=db.ref("marcadorSimple/"+match+"/voleibol"),$=id=>document.getElementById(id);
const defaults={teamAName:"LOCAL",teamBName:"VISITANTE",pointsA:0,pointsB:0,setsA:0,setsB:0,setNumber:1,serving:1,finished:false,history:[]};let state={...defaults},listening=false,history=[];
function target(){return state.setNumber===5?15:25}function won(a,b){return a>=target()&&a-b>=2}function save(){return ref.set(state).catch(e=>{$("gameStatus").textContent="Error al guardar";throw e})}
function render(){
 $("teamA").value=state.teamAName||"LOCAL";$("teamB").value=state.teamBName||"VISITANTE";$("nameA").textContent=state.teamAName||"LOCAL";$("nameB").textContent=state.teamBName||"VISITANTE";$("pointsA").textContent=state.pointsA||0;$("pointsB").textContent=state.pointsB||0;$("setNumber").textContent=state.finished?"FIN":state.setNumber;
 $("setsA").innerHTML=Array.from({length:Math.max(3,Number(state.setsA)||0,Number(state.setsB)||0)},(_,i)=>`<span class="${i<state.setsA?"won":""}">${i<state.setsA?"✓":"-"}</span>`).join("");$("setsB").innerHTML=Array.from({length:Math.max(3,Number(state.setsA)||0,Number(state.setsB)||0)},(_,i)=>`<span class="${i<state.setsB?"won":""}">${i<state.setsB?"✓":"-"}</span>`).join("");$("serveA").textContent=state.serving===1?"● SAQUE":"";$("serveB").textContent=state.serving===2?"● SAQUE":"";$("gameStatus").textContent=state.finished?"Partido finalizado":"Set "+state.setNumber+" · primero a "+target()+" con diferencia de 2";$("connection").textContent="Conectado";$("pointA").disabled=!!state.finished;$("pointB").disabled=!!state.finished;}
function addPoint(team){history.push(JSON.stringify(state));const key=team===1?"pointsA":"pointsB";state[key]++;state.serving=team;const a=state.pointsA,b=state.pointsB;if(won(a,b)||won(b,a)){if(won(a,b))state.setsA++;else state.setsB++;state.setNumber++;state.pointsA=0;state.pointsB=0}state.finished=false;save().then(render)}
function adjustSets(team,delta){const key=team===1?"setsA":"setsB";const next=Math.max(0,(Number(state[key])||0)+delta);if(next===state[key])return;history.push(JSON.stringify(state));state[key]=next;state.finished=false;save().then(render)}
$("setAMinus").onclick=()=>adjustSets(1,-1);$("setAPlus").onclick=()=>adjustSets(1,1);$("setBMinus").onclick=()=>adjustSets(2,-1);$("setBPlus").onclick=()=>adjustSets(2,1);
function listen(){if(listening)return;listening=true;ref.on("value",s=>{state={...defaults,...(s.val()||{})};state.finished=false;render()},e=>{$("connection").textContent=e.code==="PERMISSION_DENIED"?"Sin permisos Firebase":"Error Firebase";$("gameStatus").textContent=e.message||"No se pudo leer el partido"})}
$("pointA").onclick=()=>addPoint(1);$("pointB").onclick=()=>addPoint(2);$("serveAButton").onclick=()=>{state.serving=1;save().then(render)};$("serveBButton").onclick=()=>{state.serving=2;save().then(render)};$("undo").onclick=()=>{if(!history.length)return;state=JSON.parse(history.pop());save().then(render)};$("reset").onclick=()=>{if(confirm("¿Reiniciar el partido de voleibol?")){state={...defaults,teamAName:$("teamA").value||"LOCAL",teamBName:$("teamB").value||"VISITANTE"};history=[];save().then(render)}};["teamA","teamB"].forEach((id,i)=>$(id).addEventListener("change",e=>{state[i?"teamBName":"teamAName"]=e.target.value.trim()|| (i?"VISITANTE":"LOCAL");save().then(render)}));
const overlayUrl=new URL("overlays/voleibol.html",location.href);overlayUrl.searchParams.set("match",match);$("link").value=overlayUrl.href;$("overlay").onclick=()=>window.open(overlayUrl.href,"_blank");$("copy").onclick=async()=>{await navigator.clipboard?.writeText($("link").value);$("gameStatus").textContent="Link OBS copiado ✓"};$("back").onclick=()=>location.href="control.html?match="+encodeURIComponent(match);$("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){$("error").textContent=e.code||"No se pudo iniciar sesión"}};auth.onAuthStateChanged(u=>{$("login").style.display=u?"none":"grid";if(u)listen()});
})();
</script>
</body></html>
