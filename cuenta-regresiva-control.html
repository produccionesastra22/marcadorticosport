<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASTRA · Cuenta regresiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="assets/firebase.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#080b11;color:#f6f8fc;font-family:Inter,system-ui,sans-serif}body{overflow-x:hidden}.app{min-height:100vh;display:grid;grid-template-columns:64px minmax(0,1fr)}
.rail{position:sticky;top:0;height:100vh;background:#0d1119;border-right:1px solid #202735;display:flex;flex-direction:column;align-items:center;padding:10px 7px;z-index:5}
.brand{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--accent-strong));font-weight:900;box-shadow:0 8px 24px var(--accent-soft);margin-bottom:18px}
.nav{display:grid;gap:7px;width:100%}.nav button{position:relative;width:50px;height:50px;border:0;background:transparent;color:#7f8ba0;border-radius:13px;font-size:19px;cursor:pointer}.nav button:hover,.nav button.active{background:#1a2130;color:#fff}.nav button.active:before{content:"";position:absolute;left:-7px;top:14px;width:3px;height:22px;border-radius:3px;background:#5b8cff}
.rail-bottom{margin-top:auto;display:grid;gap:7px}.rail-bottom button{width:50px;height:42px;border:1px solid #242c3a;background:#111722;color:#aab5c7;border-radius:11px;cursor:pointer}
.main{min-width:0;padding:16px 18px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.heading{min-width:0}.eyebrow{font-size:9px;letter-spacing:2px;color:#6e8fd4;font-weight:800}.title{font:800 22px/1.1 Montserrat,sans-serif;letter-spacing:-.5px;margin-top:4px}.sub{font-size:11px;color:#778399;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;align-items:center;gap:7px}.pill{display:flex;align-items:center;gap:7px;border:1px solid #252e3d;background:#101620;border-radius:20px;padding:7px 10px;font-size:12px;color:#9ca8ba;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.dot.ok{background:var(--accent)}.btn{border:0;border-radius:10px;background:var(--accent-strong);color:#fff;height:36px;padding:0 12px;font-weight:800;font-size:12px;cursor:pointer}.btn.secondary{background:#1a2130;color:#cbd4e3}.btn.warning{background:rgba(255,206,107,.16);border:1px solid rgba(255,206,107,.4);color:#ffce6b}.btn:active{transform:translateY(1px)}
.view{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#10151e;border:1px solid #222b39;border-radius:15px;padding:14px;box-shadow:0 12px 40px #0003}.card.full{grid-column:1/-1}.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}.card h2{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:#aeb8c9;margin:0}.hint{font-size:12px;color:#8c9bad}
label{display:block;font-size:12px;color:#9aa8b8;margin:0 0 5px}input{width:100%;height:37px;border:1px solid #2b3545;border-radius:9px;background:#090d14;color:#f5f7fb;padding:0 9px;outline:0;font:600 12px Inter}input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.preset-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.preset{height:40px;border:none;border-radius:10px;background:rgba(26,40,54,.92);color:var(--text);font-weight:700;cursor:pointer;border:1px solid var(--line);transition:all .15s ease}.preset:hover{border-color:var(--accent);background:#1b2d40}.stack{display:grid;gap:12px}.field{display:grid;gap:7px}.field label{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}.field input{height:46px;border-radius:10px;border:1px solid var(--line);background:#0d1825;color:var(--text);padding:0 12px;font-size:18px;font-weight:800;outline:none}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.preview{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;background:linear-gradient(180deg,rgba(18,29,41,.92),rgba(9,15,22,.9));border:1px solid #2b4057;border-radius:18px;padding:22px;box-shadow:0 22px 60px rgba(0,0,0,.35)}
.live-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid rgba(102,225,177,.35);background:rgba(102,225,177,.08);color:#66e1b1;font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase}.live-badge::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#66e1b1;box-shadow:0 0 18px rgba(102,225,177,.6)}
.timer{margin-top:18px;font-size:clamp(68px,10vw,160px);font-weight:900;letter-spacing:-.08em;line-height:.9;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 10px 26px rgba(83,168,255,.24)}
.state-text{margin-top:10px;font-size:12px;letter-spacing:2px;color:#8ca1b8;text-transform:uppercase;font-weight:800}.mini-bar{width:100%;height:10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);overflow:hidden;margin-top:18px}.mini-fill{height:100%;width:0;background:linear-gradient(90deg,#53a8ff,#87d8ff);box-shadow:0 0 18px rgba(83,168,255,.45);transition:width .2s ease}.meta{display:flex;justify-content:space-between;gap:12px;margin-top:16px;color:#8ca1b8;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.row{display:flex;gap:7px;margin-top:8px}.row>*{flex:1}.quick{display:flex;gap:6px;margin-top:7px}.quick input{height:34px}.quick .btn{height:34px;padding:0 9px}.login{position:fixed;inset:0;background:#06090eec;display:none;place-items:center;padding:18px;z-index:50}.loginbox{width:min(360px,100%);background:#111721;border:1px solid #293344;border-radius:18px;padding:20px;box-shadow:0 30px 100px #0009}.loginbox h1{font:800 20px Montserrat;margin:0}.loginbox p{font-size:10px;color:#7c899d;line-height:1.5}.loginbox input{margin-top:7px}.loginbox .btn{width:100%;margin-top:8px}.error{display:none;color:#ff788a;font-size:10px;margin-top:8px}
@media(max-width:760px){.app{grid-template-columns:58px 1fr}.rail{padding:9px 5px}.rail button{width:46px}.main{padding:12px}.cards{grid-template-columns:1fr}.top .sub{display:none}.title{font-size:19px}.top-actions .btn{display:none}} 
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">A</div>
    <nav class="nav">
      <button title="Partido" aria-label="Partido" data-page="control.html">⚽</button>
      <button title="Producción" aria-label="Producción" class="active" data-page="cuenta-regresiva-control.html">◎</button>
      <button title="Diseño" aria-label="Diseño" data-page="control.html#design">✦</button>
      <button title="OBS" aria-label="OBS" data-page="index.html">▣</button>
    </nav>
    <div class="rail-bottom">
      <button title="Penales" aria-label="Penales" data-page="penales.html">🥅</button>
      <button title="Alineaciones" aria-label="Alineaciones" data-page="alineaciones.html">🧾</button>
      <button title="Rótulo" aria-label="Rótulo" data-page="rotulo.html">🏷️</button>
      <button title="Noticias" aria-label="Noticias" data-page="noticias.html">📰</button>
      <button title="Cerrar sesión" aria-label="Cerrar sesión" id="logout">↪</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="heading"><div class="eyebrow">ASTRA PRODS · PRODUCCIÓN</div><div class="title">Cuenta regresiva</div><div class="sub">Control rápido para fijar, iniciar y enviar la cuenta al aire.</div></div>
      <div class="top-actions"><div class="pill"><i class="dot ok" id="dot"></i><span id="connectionStatus">Conectado</span></div><button class="btn secondary" id="openOverlay">↗ Overlay</button></div>
    </header>

    <section class="view">
      <div class="cards">
        <section class="card full">
          <div class="card-head"><h2>Tiempo</h2><span class="hint">Preset rápida</span></div>
          <div class="preset-grid">
            <button type="button" class="preset" data-seconds="5">05 s</button>
            <button type="button" class="preset" data-seconds="15">15 s</button>
            <button type="button" class="preset" data-seconds="30">30 s</button>
            <button type="button" class="preset" data-seconds="60">01:00</button>
            <button type="button" class="preset" data-seconds="90">01:30</button>
            <button type="button" class="preset" data-seconds="120">02:00</button>
            <button type="button" class="preset" data-seconds="180">03:00</button>
            <button type="button" class="preset" data-seconds="300">05:00</button>
          </div>
          <div class="stack">
            <div class="field"><label for="countdownInput">Segundos</label><input id="countdownInput" type="number" min="0" step="1" value="30"></div>
          </div>
          <div class="actions">
            <button type="button" class="btn" id="setCountdown" data-countdown-action="set">Fijar</button>
            <button type="button" class="btn secondary" id="startCountdown" data-countdown-action="start">▶ Iniciar</button>
            <button type="button" class="btn secondary" id="pauseCountdown" data-countdown-action="pause">⏸ Pausar</button>
            <button type="button" class="btn secondary" id="resetCountdown" data-countdown-action="reset">↺ Reset</button>
            <button type="button" class="btn warning" id="sendCountdown" data-countdown-action="set">✓ Enviar</button>
          </div>
        </section>

        <aside class="card preview">
          <div class="live-badge" id="badgeStatus">Listo</div>
          <div class="timer" id="liveTimer">00:30</div>
          <div class="state-text" id="stateText">Sin iniciar</div>
          <div class="mini-bar"><div class="mini-fill" id="miniFill"></div></div>
          <div class="meta"><span id="metaBase">Base: 00:30</span><span id="metaMode">Preparado</span></div>
        </aside>
      </div>
    </section>
  </main>
</div>

<script>
document.addEventListener('click', (event) => {
  const preset = event.target.closest('[data-seconds]');
  if (preset) {
    const input = document.getElementById('countdownInput');
    if (input) {
      input.value = Math.max(0, Number(preset.dataset.seconds) || 0);
      input.dataset.dirty = '1';
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }
  const actionButton = event.target.closest('[data-countdown-action]');
  if (actionButton && typeof window.astraCountdownAction === 'function') {
    window.astraCountdownAction(actionButton.dataset.countdownAction);
  }
});

window.astraCountdownPreset = (value) => {
  const input = document.getElementById('countdownInput');
  if (input) {
    input.value = Math.max(0, Number(value) || 0);
    input.dataset.dirty = '1';
  }
};

window.astraCountdownAction = async (action) => {
  const astra = window.ASTRA;
  const input = document.getElementById('countdownInput');
  const connectionStatus = document.getElementById('connectionStatus');
  const save = astra && astra.save;
  const countdownRef = astra && typeof astra.createMatchRef === 'function' ? astra.createMatchRef('production/countdown') : null;
  const value = Math.max(0, Number(input ? input.value : 0) || 0);
  try {
    if (!countdownRef || typeof countdownRef.set !== 'function') throw new Error('Firebase no está disponible');
    if (action === 'start') {
      await countdownRef.set({ baseSeconds: value, active: true, startedAt: firebase.database.ServerValue.TIMESTAMP });
    } else if (action === 'pause') {
      const snapshot = await countdownRef.once('value');
      const data = snapshot.val() || {};
      const remaining = data.active ? Math.max(0, (Number(data.baseSeconds) || 0) - Math.floor((Date.now() - (Number(data.startedAt) || 0)) / 1000)) : Number(data.baseSeconds) || value;
      await countdownRef.set({ baseSeconds: remaining, active: false, startedAt: 0 });
    } else {
      await countdownRef.set({ baseSeconds: value, active: false, startedAt: 0 });
    }
    const verification = await countdownRef.once('value');
    const saved = verification.val() || {};
    const expected = action === 'pause' ? Number(saved.baseSeconds) || 0 : value;
    if (action !== 'pause' && Number(saved.baseSeconds) !== expected) throw new Error('Firebase no confirmó el contador');
    const timer = document.getElementById('liveTimer');
    const meta = document.getElementById('metaBase');
    const formatted = `${String(Math.floor(value / 60)).padStart(2, '0')}:${String(value % 60).padStart(2, '0')}`;
    if (timer) timer.textContent = formatted;
    if (meta) meta.textContent = `Base: ${formatted}`;
    if (connectionStatus) {
      connectionStatus.textContent = 'Enviado';
      connectionStatus.style.color = '#66e1b1';
    }
  } catch (error) {
    if (connectionStatus) {
      connectionStatus.textContent = 'Error al guardar';
      connectionStatus.style.color = '#ff788a';
    }
    console.error(error);
  }
};
</script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const match = params.get('match') || 'default';
  const route = (page) => {
    const base = page.includes('?') ? page : page + '?match=' + encodeURIComponent(match);
    location.href = base;
  };

  document.querySelectorAll('[data-page]').forEach((button) => {
    button.addEventListener('click', () => route(button.dataset.page));
  });

  document.getElementById('openOverlay').addEventListener('click', () => {
    location.href = 'overlays/cuenta-regresiva.html?match=' + encodeURIComponent(match);
  });

  document.getElementById('logout').addEventListener('click', () => {
    if (window.ASTRA && window.ASTRA.auth) {
      window.ASTRA.auth.signOut();
    }
  });

  const astra = window.ASTRA || {};
  const auth = astra.auth;
  const save = astra.save;
  const ref = typeof astra.createMatchRef === 'function' ? astra.createMatchRef('production/countdown') : null;
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(Math.max(0, Math.floor(n))).padStart(2, '0');
  const format = (total) => {
    const seconds = Math.max(0, Number(total) || 0);
    return `${pad(seconds / 60)}:${pad(seconds % 60)}`;
  };

  let countdownState = { active: false, baseSeconds: 30, startedAt: 0 };
  let inputDirty = false;

  function renderLive() {
    const base = Number(countdownState.baseSeconds) || 0;
    const startedAt = Number(countdownState.startedAt) || 0;
    const active = Boolean(countdownState.active);
    let remaining = base;

    if (active && startedAt) {
      remaining = Math.max(0, base - Math.floor((Date.now() - startedAt) / 1000));
    }

    const liveTimer = $('#liveTimer');
    const countdownInput = $('#countdownInput');
    const metaBase = $('#metaBase');
    const badgeStatus = $('#badgeStatus');
    const stateText = $('#stateText');
    const miniFill = $('#miniFill');
    const metaMode = $('#metaMode');

    if (liveTimer) liveTimer.textContent = format(remaining);
    if (metaBase) metaBase.textContent = 'Base: ' + format(base);

    if (!base && !active) {
      if (badgeStatus) badgeStatus.textContent = 'Listo';
      if (stateText) stateText.textContent = 'Sin iniciar';
      if (metaMode) metaMode.textContent = 'Preparado';
      if (miniFill) miniFill.style.width = '0%';
      return;
    }

    if (active && remaining > 0) {
      if (badgeStatus) badgeStatus.textContent = 'En marcha';
      if (stateText) stateText.textContent = 'Cuenta regresiva activa';
      if (metaMode) metaMode.textContent = 'Transmitiendo';
      if (miniFill) miniFill.style.width = (remaining / base * 100) + '%';
      return;
    }

    if (active && remaining === 0) {
      if (badgeStatus) badgeStatus.textContent = 'Finalizado';
      if (stateText) stateText.textContent = 'Tiempo agotado';
      if (metaMode) metaMode.textContent = 'Aviso';
      if (miniFill) miniFill.style.width = '100%';
      return;
    }

    if (badgeStatus) badgeStatus.textContent = 'Pausada';
    if (stateText) stateText.textContent = 'Cuenta detenida';
    if (metaMode) metaMode.textContent = 'Pausada';
    if (miniFill) miniFill.style.width = (remaining / base * 100) + '%';
  }

  function applyPreset(value) {
    const seconds = Math.max(0, Number(value) || 0);
    const countdownInput = $('#countdownInput');
    if (countdownInput) {
      countdownInput.value = seconds;
      inputDirty = true;
      countdownInput.dataset.dirty = '1';
    }
  }
  window.astraCountdownPreset = applyPreset;

  async function setCountdown() {
    const countdownInput = $('#countdownInput');
    const value = Math.max(0, Number(countdownInput ? countdownInput.value : 0) || 0);
    if (typeof save !== 'function') throw new Error('Firebase no está disponible');
    await save({ 'production/countdown/baseSeconds': value, 'production/countdown/active': false, 'production/countdown/startedAt': 0 });
    inputDirty = false;
    if (countdownInput) countdownInput.dataset.dirty = '';
    renderLive();
  }

  async function startCountdown() {
    const countdownInput = $('#countdownInput');
    const value = Math.max(0, Number(countdownInput ? countdownInput.value : 0) || 0);
    if (typeof save !== 'function') throw new Error('Firebase no está disponible');
    await save({ 'production/countdown/baseSeconds': value, 'production/countdown/active': true, 'production/countdown/startedAt': firebase.database.ServerValue.TIMESTAMP });
    inputDirty = false;
    if (countdownInput) countdownInput.dataset.dirty = '';
  }

  async function pauseCountdown() {
    const current = Number(countdownState.baseSeconds) || 0;
    const remaining = current > 0 && countdownState.active ? Math.max(0, current - Math.floor((Date.now() - (Number(countdownState.startedAt) || 0)) / 1000)) : current;
    if (typeof save !== 'function') throw new Error('Firebase no está disponible');
    await save({ 'production/countdown/baseSeconds': remaining, 'production/countdown/active': false, 'production/countdown/startedAt': 0 });
    inputDirty = false;
    if ($('#countdownInput')) $('#countdownInput').dataset.dirty = '';
  }

  async function resetCountdown() {
    const countdownInput = $('#countdownInput');
    const value = Math.max(0, Number(countdownInput ? countdownInput.value : 0) || 0);
    if (typeof save !== 'function') throw new Error('Firebase no está disponible');
    await save({ 'production/countdown/baseSeconds': value, 'production/countdown/active': false, 'production/countdown/startedAt': 0 });
    inputDirty = false;
    if (countdownInput) countdownInput.dataset.dirty = '';
  }

  const countdownInputElement = $('#countdownInput');
  if (countdownInputElement) countdownInputElement.addEventListener('input', () => {
    inputDirty = true;
    countdownInputElement.dataset.dirty = '1';
  });

  const bindClick = (id, callback) => {
    const element = $(id);
    if (element) element.addEventListener('click', callback);
  };

  const runAction = (action) => async () => {
    try {
      await action();
    } catch (error) {
      const connectionStatus = $('#connectionStatus');
      if (connectionStatus) {
        connectionStatus.textContent = 'Error al guardar';
        connectionStatus.style.color = '#ff788a';
      }
      console.error(error);
    }
  };
  window.astraCountdownActionLegacy = (name) => {
    const actions = { set: setCountdown, start: startCountdown, pause: pauseCountdown, reset: resetCountdown };
    return runAction(actions[name] || setCountdown)();
  };

  if (!auth || !ref) {
    const connectionStatus = $('#connectionStatus');
    if (connectionStatus) {
      connectionStatus.textContent = 'Sin conexión';
      connectionStatus.style.color = '#ffce6b';
    }
  } else auth.signInAnonymously()
    .then(() => {
      if (!ref) throw new Error('Firebase no está disponible');
      ref.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        countdownState = {
          active: !!data.active,
          baseSeconds: Number(data.baseSeconds) || 0,
          startedAt: Number(data.startedAt) || 0
        };
        renderLive();
      });
    })
    .catch(() => {
      const connectionStatus = $('#connectionStatus');
      if (connectionStatus) {
        connectionStatus.textContent = 'Sin conexión';
        connectionStatus.style.color = '#ffce6b';
      }
    });

  setInterval(() => {
    if (countdownState.active) renderLive();
  }, 250);
})();
</script>
</body>
</html>
