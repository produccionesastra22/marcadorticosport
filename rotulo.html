<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRA · Rótulo</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.wrap{
    width:min(600px,94vw);
    margin:auto;
    padding:25px 0;
}

h1{
    margin:0 0 5px;
    font-size:28px;
}

.subtitle{
    color:#777;
    font-size:12px;
    margin-bottom:20px;
}

.card{
    background:#0b0b0b;
    border:1px solid #202020;
    padding:16px;
    margin-bottom:10px;
}

label{
    display:block;
    color:#888;
    font-size:11px;
    margin:10px 0 5px;
}

input,select{
    width:100%;
    height:40px;
    background:#000;
    color:#fff;
    border:1px solid #303030;
    padding:0 10px;
    border-radius:5px;
    outline:none;
}

input:focus,select:focus{
    border-color:#555;
}

input[type=color]{
    padding:3px;
}

.row{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.row>*{
    flex:1;
}

button{
    height:42px;
    border:0;
    border-radius:5px;
    background:#fff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button.secondary{
    background:#181818;
    color:#fff;
    border:1px solid #292929;
}

button.off{
    background:#401111;
    color:#fff;
}

.status{
    font-size:11px;
    color:#777;
    margin-top:8px;
}

#link{
    margin-top:8px;
}

.login{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
}

.loginbox{
    width:min(350px,90vw);
    background:#0b0b0b;
    border:1px solid #252525;
    padding:22px;
}

.loginbox h2{
    margin:0 0 15px;
    font-size:20px;
}

.loginbox input{
    margin-bottom:8px;
}

.loginbox button{
    width:100%;
    margin-top:5px;
}

#error{
    color:#e55;
    font-size:11px;
    margin-top:8px;
}
</style>
<link rel="stylesheet" href="assets/theme.css?v=20260918-3">
<style>
.wrap{width:min(780px,calc(94vw - 64px))}.editor-card{background:linear-gradient(145deg,#101d2d,#0d1722);border-color:#384f6f;box-shadow:0 18px 50px rgba(0,0,0,.25)}.preview-panel{margin-bottom:10px;padding:14px;background:#0d1722;border:1px solid #2d4359;border-radius:12px}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#a9b9ca;font-size:9px;font-weight:900;letter-spacing:1.5px}.preview-head span{color:#6c8298;font-weight:600;letter-spacing:0}.preview-stage{position:relative;aspect-ratio:16/6;background:radial-gradient(circle at 78% 30%,rgba(86,123,255,.28),transparent 25%),linear-gradient(135deg,#0a1424,#101b28 58%,#090d13);border:1px solid #2c4056;border-radius:9px;overflow:hidden}.preview-stage:after{content:"TRANSMISIÓN EN VIVO";position:absolute;top:16%;right:7%;font-size:8px;letter-spacing:2px;color:#7ea1c7}.preview-lower{position:absolute;left:6%;right:6%;bottom:15%;display:flex;align-items:stretch;min-height:76px;background:linear-gradient(135deg,rgba(15,23,32,.97),rgba(10,17,25,.95));border:1px solid rgba(108,147,180,.52);border-left:8px solid #4e7fff;border-radius:10px;box-shadow:0 18px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden}.preview-accent{width:10px;background:linear-gradient(180deg,#8ab1ff,#4e7fff)}.preview-badge{display:flex;align-items:center;justify-content:center;width:72px;min-width:72px;background:rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.08)}.preview-badge img{display:none;max-width:48px;max-height:48px;object-fit:contain;transform:scale(var(--logo-scale,1));transform-origin:center}.preview-badge span{font-size:10px;font-weight:900;letter-spacing:2px}.preview-copy{padding:12px 18px}.preview-name{font:900 clamp(18px,3vw,32px)/1 Arial;text-transform:uppercase;letter-spacing:.06em}.preview-cargo{margin-top:6px;color:#d8e4f0;font:bold clamp(10px,1.2vw,15px)/1 Arial;letter-spacing:.1em;text-transform:uppercase}.preview-live{position:absolute;left:7%;bottom:5%;font-size:8px;color:#9bb3c9;letter-spacing:1.5px;text-transform:uppercase}@media(max-width:700px){.wrap{width:94vw}.preview-lower{left:4%;right:4%;min-height:62px}.preview-copy{padding:9px 12px}}
</style>
</head>

<body class="has-module-rail">

<aside class="module-rail" aria-label="Módulos ASTRA">
    <a class="rail-brand" data-route="control.html" href="#" title="Control ASTRA">A</a>
    <a data-route="control.html" href="#" title="Marcador">⚽</a>
    <a data-route="penales.html" href="#" title="Penales">🥅</a>
    <a data-route="alineaciones.html" href="#" title="Alineaciones">🧾</a>
    <a class="active" data-route="rotulo.html" href="#" title="Rótulo">🏷️</a>
    <a data-route="noticias.html" href="#" title="Noticias">📰</a>
    <span class="rail-spacer"></span>
</aside>
<script>const moduleMatch=encodeURIComponent(new URLSearchParams(location.search).get("match")||"default");document.querySelectorAll(".module-rail [data-route]").forEach(a=>a.href=a.dataset.route+"?match="+moduleMatch);</script>

<div class="wrap">

    <h1>RÓTULO</h1>
    <div class="subtitle">Control de identificación en pantalla</div>

    <div class="card editor-card">

        <label>NOMBRE</label>
        <input id="name" placeholder="Nombre completo">

        <label>CARGO / DESCRIPCIÓN</label>
        <input id="cargo" placeholder="Periodista deportivo">

        <label>COLOR PRINCIPAL</label>
        <input id="color1" type="color" value="#4e7fff">

        <label>COLOR SECUNDARIO</label>
        <input id="color2" type="color" value="#111111">

        <label>FUENTE</label>
        <select id="font">
            <option value="Arial">Arial</option>
            <option value="Helvetica">Helvetica</option>
            <option value="Verdana">Verdana</option>
        </select>
        <label>URL DEL LOGO</label>
        <input id="logo" type="url" placeholder="https://tusitio.com/logo.png">
        <label>TAMAÑO DEL LOGO / BADGE</label>
        <input id="logoScale" type="range" min="0.6" max="1.8" step="0.05" value="1">

        <div class="status" id="status">Esperando conexión...</div>

    </div>

    <section class="preview-panel">
        <div class="preview-head"><span>VISTA PREVIA DEL LOWER THIRD</span><span>Se actualiza al editar</span></div>
        <div class="preview-stage">
            <div class="preview-lower" id="previewCard">
                <div class="preview-accent" id="previewAccent"></div>
                <div class="preview-badge" id="previewBadge"><img id="previewLogo"><span id="previewLogoText">ASTRA</span></div>
                <div class="preview-copy"><div class="preview-name" id="previewName">Nombre completo</div><div class="preview-cargo" id="previewCargo">Periodista deportivo</div></div>
            </div>
            <div class="preview-live">ASTRA · RÓTULO</div>
        </div>
    </section>

    <div class="row">
        <button id="toggleShow">MOSTRAR</button>
    </div>

    <div class="row">
        <button class="secondary" id="overlay">ABRIR OVERLAY</button>
        <button class="secondary" id="copy">COPIAR LINK OBS</button>
    </div>

    <input id="link" readonly>

    <div class="row">
        <button class="secondary" id="back">← VOLVER AL CONTROL</button>
    </div>

</div>

<div class="login" id="login">
    <div class="loginbox">
        <h2>ACCESO</h2>
        <input id="email" type="email" placeholder="Correo">
        <input id="password" type="password" placeholder="Contraseña">
        <button id="loginBtn">ENTRAR</button>
        <div id="error"></div>
    </div>
</div>

<script>
(() => {

const FIREBASE_CONFIG={
    apiKey:"AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",
    authDomain:"astraprods.firebaseapp.com",
    databaseURL:"https://astraprods-default-rtdb.firebaseio.com",
    projectId:"astraprods"
};

if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
}

const auth=firebase.auth();
const db=firebase.database();
const ref=db.ref("rotulo");

const defaults={
    name:"",
    cargo:"",
    color1:"#4e7fff",
    color2:"#111111",
    font:"Arial",
    logo:"",
    logoScale:1,
    visible:false,
    updatedAt:0
};

let state={...defaults};
let listening=false;
let saveTimer=null;

const $=id=>document.getElementById(id);

function save(data){
    clearTimeout(saveTimer);

    saveTimer=setTimeout(()=>{
        ref.update({
            ...data,
            updatedAt:firebase.database.ServerValue.TIMESTAMP
        }).catch(err=>{
            console.error(err);
            $("status").textContent="Error de Firebase";
        });
    },120);
}

function render(){

    $("name").value=state.name||"";
    $("cargo").value=state.cargo||"";
    $("color1").value=state.color1||"#4e7fff";
    $("color2").value=state.color2||"#111111";
    $("font").value=state.font||"Arial";
    $("logo").value=state.logo||"";
    $("logoScale").value=String(state.logoScale ?? 1);
    renderPreview();

    $("toggleShow").textContent=
        state.visible ? "OCULTAR DEL AIRE" : "MOSTRAR EN AIRE";

    $("toggleShow").classList.toggle("off",!!state.visible);

    $("status").textContent=
        state.visible ? "● Rótulo EN AIRE" : "● Rótulo oculto";
}

function renderPreview(){
    const name=$("name").value.trim()||"Nombre completo";
    const cargo=$("cargo").value.trim()||"Periodista deportivo";
    const color1=$("color1").value||"#4e7fff";
    const color2=$("color2").value||"#111111";
    const font=$("font").value||"Arial";
    const logoScale=Number($("logoScale").value)||1;
    const logo=$("logo").value.trim();
    $("previewName").textContent=name;
    $("previewCargo").textContent=cargo;
    $("previewAccent").style.background=color1;
    $("previewCard").style.borderLeftColor=color1;
    $("previewCard").style.background=color2;
    $("previewBadge").style.setProperty("--logo-scale", String(logoScale));
    $("previewLogo").src=logo;
    $("previewLogo").style.display=logo?"block":"none";
    $("previewLogoText").style.display=logo?"none":"block";
    $("previewName").style.fontFamily=font+",Helvetica,sans-serif";
    $("previewCargo").style.fontFamily=font+",Helvetica,sans-serif";
}

function startListen(){

    if(listening)return;
    listening=true;

    ref.on("value",snap=>{

        const data=snap.val()||{};

        state={
            ...defaults,
            ...data
        };

        render();

    },err=>{

        console.error(err);
        $("status").textContent="Error: "+err.message;

    });
}

["name","cargo","color1","color2","font","logo","logoScale"].forEach(id=>{

    $(id).addEventListener("input",renderPreview);

    $(id).addEventListener("change",e=>{

        const nextValue = id === "logoScale" ? Number(e.target.value) : e.target.value;
        state[id]=nextValue;

        save({
            [id]:nextValue
        });

    });

});

$("toggleShow").onclick=()=>{

    state.visible=!state.visible;

    save({
        visible:state.visible
    });

    render();

};

function overlayUrl(){

    return new URL(
        "overlays/overlays_rotulo.html",
        location.href
    ).href;

}

$("link").value=overlayUrl();

$("copy").onclick=async()=>{

    try{

        await navigator.clipboard.writeText($("link").value);
        $("status").textContent="Link copiado ✓";

    }catch(e){

        $("link").select();
        document.execCommand("copy");

    }

};

$("overlay").onclick=()=>{
    window.open(overlayUrl(),"_blank");
};

$("back").onclick=()=>{
    location.href="control.html";
};

$("loginBtn").onclick=async()=>{

    $("error").textContent="";

    try{

        await auth.signInWithEmailAndPassword(
            $("email").value.trim(),
            $("password").value
        );

    }catch(e){

        $("error").textContent=e.code||"No se pudo iniciar sesión";

    }

};

auth.onAuthStateChanged(user=>{

    $("login").style.display=user?"none":"flex";

    if(user){
        startListen();
    }

});

})();
</script>

</body>
</html>
