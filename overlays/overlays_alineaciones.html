<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/theme.css?v=20260918-4">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="../assets/firebase.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:transparent!important;

    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

#wrap{
    position:absolute;

    left:5vw;
    right:5vw;
    top:6vh;
    bottom:6vh;

    opacity:0;

    pointer-events:none;

    transition:opacity .25s ease;
}

#wrap.show{
    opacity:1;
}

.cols{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:4vw;

    height:100%;
}

.col{
    min-width:0;
}

.col h2{

    margin:0 0 14px;

    padding-bottom:8px;

    border-bottom:2px solid #fff;

    font-size:clamp(18px,2vw,32px);

    font-weight:900;

    text-transform:uppercase;

}

.right h2{
    text-align:right;
}

.player{

    display:flex;

    align-items:center;

    gap:10px;

    min-height:40px;

    margin-bottom:7px;

    padding:7px 12px;

    background:rgba(0,0,0,.82);

    border:1px solid rgba(255,255,255,.18);

    font-size:clamp(13px,1.35vw,20px);

    font-weight:bold;

    opacity:0;

    transform:translateY(10px);

}

.left .player{
    justify-content:flex-start;
}

.right .player{
    justify-content:flex-end;
    text-align:right;
}

#wrap.show .player{
    animation:playerIn .35s ease forwards;
}

.num{

    width:29px;
    height:29px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex:0 0 29px;

    border:1px solid #fff;

    border-radius:50%;

    font-size:12px;
    font-weight:900;

}

@keyframes playerIn{

    to{
        opacity:1;
        transform:translateY(0);
    }

}

#login{

    position:fixed;
    inset:0;

    z-index:99;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000;

}

.box{

    width:min(350px,90vw);

    background:#090909;

    border:1px solid #252525;

    padding:22px;

    color:#fff;

}

.box h2{
    margin:0 0 15px;
}

.box input{

    width:100%;

    height:42px;

    margin-bottom:8px;

    background:#000;

    color:#fff;

    border:1px solid #303030;

    padding:0 10px;

}

.box button{

    width:100%;

    height:42px;

    border:0;

    background:#fff;

    color:#000;

    font-weight:bold;

}

#error{

    color:#e55;

    font-size:11px;

    margin-top:8px;

}

@media(max-width:700px){

    .cols{
        gap:15px;
    }

    .player{
        font-size:12px;
    }

}

</style>
<style>
html,body{background:transparent!important}.stage-noise{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(53,138,218,.2),transparent 42%),linear-gradient(90deg,transparent 0 49.7%,rgba(255,255,255,.08) 49.7% 50.3%,transparent 50.3%);opacity:.55}.cols{position:relative;gap:clamp(20px,5vw,80px);align-items:start}.col{position:relative;padding:18px 0}.col:before{content:"";position:absolute;inset:0 -18px;background:linear-gradient(180deg,rgba(7,18,30,.9),rgba(7,14,23,.58));border:1px solid rgba(107,169,215,.28);border-radius:14px;box-shadow:0 20px 55px rgba(0,0,0,.35);z-index:-1}.col h2{margin:0 14px 16px;padding:12px 14px;border:0;border-left:5px solid var(--accent);border-bottom:1px solid rgba(120,190,240,.35);background:linear-gradient(90deg,rgba(38,111,175,.42),rgba(10,25,40,.15));font-size:clamp(18px,2.2vw,32px);letter-spacing:1px;text-shadow:0 3px 18px #000;text-align:left}.right h2{border-left:0;border-right:5px solid var(--accent);text-align:right;background:linear-gradient(270deg,rgba(145,46,65,.42),rgba(10,25,40,.15))}.player{min-height:44px;margin:0 14px 8px;padding:8px 12px;background:linear-gradient(90deg,rgba(17,42,64,.94),rgba(8,20,32,.94));border:1px solid rgba(116,177,220,.28);border-radius:8px;box-shadow:0 7px 18px rgba(0,0,0,.2);font-size:clamp(13px,1.35vw,20px);letter-spacing:.2px;animation:playerIn .48s cubic-bezier(.2,.8,.2,1) both}.right .player{background:linear-gradient(270deg,rgba(60,27,39,.94),rgba(18,19,30,.94));border-color:rgba(236,97,113,.3)}.num{border:0;border-radius:7px;background:var(--accent);color:#06111d;box-shadow:0 0 18px rgba(85,167,255,.24)}.right .num{background:var(--accent);color:#21080e}.player:hover{filter:brightness(1.2)}@keyframes playerIn{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}@media(prefers-reduced-motion:reduce){.player{animation:none}}
</style>
</head>

<body>

<div id="login">

    <div class="box">

        <h2>ACCESO</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Correo"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Contraseña"
        >

        <button id="loginBtn">
            ENTRAR
        </button>

        <div id="error"></div>

    </div>

</div>

<div id="wrap">

    <div class="stage-noise"></div>

    <div class="cols">

        <div class="col left">

            <h2 id="nameA">
                EQUIPO A
            </h2>

            <div id="playersA"></div>

        </div>

        <div class="col right">

            <h2 id="nameB">
                EQUIPO B
            </h2>

            <div id="playersB"></div>

        </div>

    </div>

</div>

<script>
(() => {

const {auth,db}=window.ASTRA;
const ref=window.ASTRA.createRef("alineaciones");

const $=id=>
    document.getElementById(id);

let listening=false;
let visible=false;

function drawPlayers(id,players,right){

    const container=$(id);

    container.innerHTML="";

    const list=(players||[])
        .filter(player=>
            player &&
            String(player.name||"").trim()
        );

    list.forEach((player,index)=>{

        const row=
            document.createElement("div");

        row.className="player";

        row.style.animationDelay=
            (index*55)+"ms";

        const number=
            document.createElement("span");

        number.className="num";

        number.textContent=
            player.num||"-";

        const name=
            document.createElement("span");

        name.textContent=
            player.name;

        if(right){

            row.appendChild(name);
            row.appendChild(number);

        }else{

            row.appendChild(number);
            row.appendChild(name);

        }

        container.appendChild(row);

    });

}

function draw(state){

    $("nameA").textContent=
        state.teamA?.name||
        "EQUIPO A";

    $("nameB").textContent=
        state.teamB?.name||
        "EQUIPO B";

    drawPlayers(
        "playersA",
        state.teamA?.players,
        false
    );

    drawPlayers(
        "playersB",
        state.teamB?.players,
        true
    );

}

function render(state){

    const newVisible=
        !!state.visible;

    if(newVisible){
        draw(state);
        if(!visible){
            $("wrap").classList.remove("show");
            void $("wrap").offsetWidth;
            requestAnimationFrame(()=>$("wrap").classList.add("show"));
        }

    }

    if(!newVisible){

        $("wrap").classList.remove("show");

    }

    visible=newVisible;

}

function startListen(){

    if(listening)return;

    listening=true;

    ref.on(
        "value",
        snap=>{

            const state=snap.val()||{};

            render(state);

        },
        err=>{

            console.error(err);

        }
    );

}

$("login").style.display="none";
auth.signInAnonymously().then(startListen).catch(e=>console.error("Firebase auth:",e.code||e.message));

};

})();
</script>

</body>
</html>
