<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:transparent!important;

    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

#wrap{
    position:absolute;

    left:5vw;
    right:5vw;
    top:6vh;
    bottom:6vh;

    opacity:0;

    pointer-events:none;

    transition:opacity .25s ease;
}

#wrap.show{
    opacity:1;
}

.cols{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:4vw;

    height:100%;
}

.col{
    min-width:0;
}

.col h2{

    margin:0 0 14px;

    padding-bottom:8px;

    border-bottom:2px solid #fff;

    font-size:clamp(18px,2vw,32px);

    font-weight:900;

    text-transform:uppercase;

}

.right h2{
    text-align:right;
}

.player{

    display:flex;

    align-items:center;

    gap:10px;

    min-height:40px;

    margin-bottom:7px;

    padding:7px 12px;

    background:rgba(0,0,0,.82);

    border:1px solid rgba(255,255,255,.18);

    font-size:clamp(13px,1.35vw,20px);

    font-weight:bold;

    opacity:0;

    transform:translateY(10px);

}

.left .player{
    justify-content:flex-start;
}

.right .player{
    justify-content:flex-end;
    text-align:right;
}

#wrap.show .player{
    animation:playerIn .35s ease forwards;
}

.num{

    width:29px;
    height:29px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex:0 0 29px;

    border:1px solid #fff;

    border-radius:50%;

    font-size:12px;
    font-weight:900;

}

@keyframes playerIn{

    to{
        opacity:1;
        transform:translateY(0);
    }

}

#login{

    position:fixed;
    inset:0;

    z-index:99;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000;

}

.box{

    width:min(350px,90vw);

    background:#090909;

    border:1px solid #252525;

    padding:22px;

    color:#fff;

}

.box h2{
    margin:0 0 15px;
}

.box input{

    width:100%;

    height:42px;

    margin-bottom:8px;

    background:#000;

    color:#fff;

    border:1px solid #303030;

    padding:0 10px;

}

.box button{

    width:100%;

    height:42px;

    border:0;

    background:#fff;

    color:#000;

    font-weight:bold;

}

#error{

    color:#e55;

    font-size:11px;

    margin-top:8px;

}

@media(max-width:700px){

    .cols{
        gap:15px;
    }

    .player{
        font-size:12px;
    }

}

</style>
</head>

<body>

<div id="login">

    <div class="box">

        <h2>ACCESO</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Correo"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Contraseña"
        >

        <button id="loginBtn">
            ENTRAR
        </button>

        <div id="error"></div>

    </div>

</div>

<div id="wrap">

    <div class="cols">

        <div class="col left">

            <h2 id="nameA">
                EQUIPO A
            </h2>

            <div id="playersA"></div>

        </div>

        <div class="col right">

            <h2 id="nameB">
                EQUIPO B
            </h2>

            <div id="playersB"></div>

        </div>

    </div>

</div>

<script>
(() => {

const FIREBASE_CONFIG={
    apiKey:"AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",
    authDomain:"astraprods.firebaseapp.com",
    databaseURL:"https://astraprods-default-rtdb.firebaseio.com",
    projectId:"astraprods"
};

if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
}

const auth=firebase.auth();
const db=firebase.database();

const ref=
    db.ref("alineaciones");

const $=id=>
    document.getElementById(id);

let listening=false;
let visible=false;

function drawPlayers(id,players,right){

    const container=$(id);

    container.innerHTML="";

    const list=(players||[])
        .filter(player=>
            player &&
            String(player.name||"").trim()
        );

    list.forEach((player,index)=>{

        const row=
            document.createElement("div");

        row.className="player";

        row.style.animationDelay=
            (index*55)+"ms";

        const number=
            document.createElement("span");

        number.className="num";

        number.textContent=
            player.num||"-";

        const name=
            document.createElement("span");

        name.textContent=
            player.name;

        if(right){

            row.appendChild(name);
            row.appendChild(number);

        }else{

            row.appendChild(number);
            row.appendChild(name);

        }

        container.appendChild(row);

    });

}

function draw(state){

    $("nameA").textContent=
        state.teamA?.name||
        "EQUIPO A";

    $("nameB").textContent=
        state.teamB?.name||
        "EQUIPO B";

    drawPlayers(
        "playersA",
        state.teamA?.players,
        false
    );

    drawPlayers(
        "playersB",
        state.teamB?.players,
        true
    );

}

function render(state){

    const newVisible=
        !!state.visible;

    if(newVisible && !visible){

        draw(state);

        $("wrap").classList.remove("show");

        void $("wrap").offsetWidth;

        requestAnimationFrame(()=>{

            $("wrap").classList.add("show");

        });

    }

    if(!newVisible){

        $("wrap").classList.remove("show");

    }

    visible=newVisible;

}

function startListen(){

    if(listening)return;

    listening=true;

    ref.on(
        "value",
        snap=>{

            const state=snap.val()||{};

            render(state);

        },
        err=>{

            console.error(err);

        }
    );

}

auth.onAuthStateChanged(user=>{

    $("login").style.display=
        user?"none":"flex";

    if(user){
        startListen();
    }

});

$("loginBtn").onclick=async()=>{

    $("error").textContent="";

    try{

        await auth.signInWithEmailAndPassword(
            $("loginEmail").value.trim(),
            $("loginPassword").value
        );

    }catch(e){

        $("error").textContent=
            e.code||
            "No se pudo iniciar sesión";

    }

};

})();
</script>

</body>
</html>
