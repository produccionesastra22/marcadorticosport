<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font-family:Inter,sans-serif;color:#fff}
.wrap{position:absolute;inset:6vh 6vw;display:flex;flex-direction:column;gap:18px;opacity:0;pointer-events:none;transition:opacity .3s}
.wrap.show{opacity:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;height:100%}
.col h2{font-family:Montserrat;font-size:clamp(16px,1.8vw,26px);font-weight:900;text-transform:uppercase;letter-spacing:1px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid rgba(255,255,255,.25)}
.col.right h2{text-align:right}
.player{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;margin-bottom:7px;font-size:clamp(12px,1.3vw,18px);font-weight:700;opacity:0;transform:translateY(14px)}
.col.right .player{flex-direction:row-reverse;text-align:right}
.wrap.show .player{animation:pIn .45s cubic-bezier(.2,.8,.2,1) forwards}
.num{width:26px;height:26px;border-radius:50%;background:#4e7fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
@keyframes pIn{to{opacity:1;transform:translateY(0)}}
#login{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:#090d14}
#login .box{width:min(360px,90vw);padding:24px;border:1px solid #273044;border-radius:18px;background:#121824}
#login input{width:100%;height:42px;margin:5px 0;background:#090d14;border:1px solid #303a4e;color:#fff;border-radius:10px;padding:0 11px}
#login button{width:100%;height:42px;margin-top:8px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-weight:800}
</style></head><body>
<div id="login"><div class="box"><h1 style="font-size:18px;margin:0 0 8px">Acceso al overlay</h1><input id="loginEmail" type="email" placeholder="Correo"><input id="loginPassword" type="password" placeholder="Contraseña"><button id="loginBtn">Entrar</button></div></div>
<div class="wrap" id="wrap"><div class="cols">
<div class="col left"><h2 id="nameA">EQUIPO A</h2><div id="playersA"></div></div>
<div class="col right"><h2 id="nameB">EQUIPO B</h2><div id="playersB"></div></div>
</div></div>
<script>
(() => {
  const FIREBASE_CONFIG={apiKey:"AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",authDomain:"astraprods.firebaseapp.com",databaseURL:"https://astraprods-default-rtdb.firebaseio.com",projectId:"astraprods"};
  const params=new URLSearchParams(location.search),matchId=params.get("match")||params.get("uuid")||"default";
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),db=firebase.database(),ref=db.ref("alineaciones/"+matchId);
  const $=id=>document.getElementById(id);
  function draw(id,arr,side){$(id).innerHTML=(arr||[]).filter(n=>n&&n.trim()).map((n,i)=>`<div class="player" style="animation-delay:${i*70}ms">${side==="right"?`<span>${n}</span><span class="num">${i+1}</span>`:`<span class="num">${i+1}</span><span>${n}</span>`}</div>`).join("")}
  function render(state){
    $("nameA").textContent=state.teamA?.name||"EQUIPO A";$("nameB").textContent=state.teamB?.name||"EQUIPO B";
    const wrap=$("wrap");
    if(state.visible){
      wrap.classList.remove("show");void wrap.offsetWidth;
      draw("playersA",state.teamA?.players,"left");draw("playersB",state.teamB?.players,"right");
      requestAnimationFrame(()=>wrap.classList.add("show"));
    } else { wrap.classList.remove("show"); }
  }
  ref.on("value",snap=>render(snap.val()||{}));
  auth.onAuthStateChanged(u=>{$("login").style.display=u?"none":"flex"});
  $("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPassword").value)}catch(e){alert(e.code||"No se pudo iniciar sesión")}};
})();
</script></body></html>
