<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent!important;
}

#card{
    position:absolute;
    left:5vw;
    bottom:8vh;

    display:flex;

    min-width:300px;
    max-width:70vw;

    background:#111;
    border-left:8px solid #4e7fff;

    transform:translateX(-120%);
    opacity:0;

    transition:
        transform .35s ease,
        opacity .25s ease;
}

#card.show{
    transform:translateX(0);
    opacity:1;
}

.body{
    padding:13px 28px 13px 16px;
}

.name{
    font-family:Arial,Helvetica,sans-serif;
    font-size:clamp(20px,2.4vw,36px);
    font-weight:900;
    line-height:1.05;
    color:#fff;
    text-transform:uppercase;
}

.cargo{
    margin-top:5px;

    font-family:Arial,Helvetica,sans-serif;
    font-size:clamp(11px,1.1vw,17px);
    font-weight:bold;

    color:#ddd;
}

#login{
    position:fixed;
    inset:0;
    z-index:99;

    display:none;
    align-items:center;
    justify-content:center;

    background:#000;
}

.box{
    width:min(350px,90vw);
    background:#090909;
    border:1px solid #252525;
    padding:22px;
    color:#fff;
    font-family:Arial,sans-serif;
}

.box h2{
    margin:0 0 15px;
}

.box input{
    width:100%;
    height:42px;

    margin-bottom:8px;

    background:#000;
    color:#fff;

    border:1px solid #303030;

    padding:0 10px;
}

.box button{
    width:100%;
    height:42px;

    border:0;
    background:#fff;
    color:#000;

    font-weight:bold;
}

#error{
    color:#e55;
    font-size:11px;
    margin-top:8px;
}

</style>
</head>

<body>

<div id="login">

    <div class="box">

        <h2>ACCESO</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Correo"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Contraseña"
        >

        <button id="loginBtn">
            ENTRAR
        </button>

        <div id="error"></div>

    </div>

</div>

<div id="card">

    <div class="body">

        <div class="name" id="name"></div>

        <div class="cargo" id="cargo"></div>

    </div>

</div>

<script>
(() => {

const FIREBASE_CONFIG={
    apiKey:"AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",
    authDomain:"astraprods.firebaseapp.com",
    databaseURL:"https://astraprods-default-rtdb.firebaseio.com",
    projectId:"astraprods"
};

if(!firebase.apps.length){
    firebase.initializeApp(FIREBASE_CONFIG);
}

const auth=firebase.auth();
const db=firebase.database();

const ref=
    db.ref("rotulo");

const $=id=>
    document.getElementById(id);

let listening=false;
let wasVisible=false;

function render(data){

    $("name").textContent=
        data.name||"";

    $("cargo").textContent=
        data.cargo||"";

    $("card").style.borderLeftColor=
        data.color1||"#4e7fff";

    $("card").style.background=
        data.color2||"#111";

    $("name").style.fontFamily=
        (data.font||"Arial")+
        ",Helvetica,sans-serif";

    $("cargo").style.fontFamily=
        (data.font||"Arial")+
        ",Helvetica,sans-serif";

    const visible=!!data.visible;

    if(visible && !wasVisible){

        $("card").classList.remove("show");

        void $("card").offsetWidth;

        requestAnimationFrame(()=>{
            $("card").classList.add("show");
        });

    }

    if(!visible){

        $("card").classList.remove("show");

    }

    wasVisible=visible;

}

function startListen(){

    if(listening)return;

    listening=true;

    ref.on(
        "value",
        snap=>{
            render(snap.val()||{});
        },
        err=>{
            console.error(err);
        }
    );

}

auth.onAuthStateChanged(user=>{

    $("login").style.display=
        user?"none":"flex";

    if(user){
        startListen();
    }

});

$("loginBtn").onclick=async()=>{

    $("error").textContent="";

    try{

        await auth.signInWithEmailAndPassword(
            $("loginEmail").value.trim(),
            $("loginPassword").value
        );

    }catch(e){

        $("error").textContent=
            e.code||
            "No se pudo iniciar sesión";

    }

};

})();
</script>

</body>
</html>
