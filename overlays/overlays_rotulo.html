<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/theme.css?v=20260918-4">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="../assets/firebase.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent!important;
}

#card{
    position:absolute;
    left:5vw;
    bottom:8vh;

    display:flex;
    align-items:stretch;

    min-width:320px;
    max-width:72vw;

    background:linear-gradient(135deg, rgba(17,24,35,0.96), rgba(12,16,23,0.94));
    border:1px solid rgba(122,164,255,0.32);
    border-left:8px solid var(--accent);
    border-radius:18px 18px 18px 10px;
    box-shadow:0 18px 54px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow:hidden;

    transform:translateX(-120%);
    opacity:0;

    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        opacity .25s ease;
}

#card.show{
    transform:translateX(0);
    opacity:1;
}

#card::before{
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:96px;
    background:linear-gradient(180deg, rgba(78,127,255,0.20), rgba(78,127,255,0));
    pointer-events:none;
}

.badge{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:72px;
    min-width:72px;
    background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border-right:1px solid rgba(255,255,255,0.08);
    transform:scale(var(--logo-scale,1));
    transform-origin:center;
}

.badge span{
    display:inline-block;
    padding:8px 10px;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:999px;
    font-size:10px;
    letter-spacing:2px;
    font-weight:900;
    color:#dbe8ff;
    text-transform:uppercase;
    background:rgba(255,255,255,0.02);
    backdrop-filter:blur(2px);
}

.badge img{
    display:none;
    width:48px;
    height:48px;
    object-fit:contain;
}

.body{
    position:relative;
    z-index:1;
    padding:16px 26px 16px 18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.name{
    font-family:Arial,Helvetica,sans-serif;
    font-size:clamp(22px,2.6vw,38px);
    font-weight:900;
    line-height:0.98;
    letter-spacing:0.04em;
    color:#fff;
    text-transform:uppercase;
    text-shadow:0 6px 18px rgba(0,0,0,0.20);
}

.cargo{
    margin-top:6px;

    font-family:Arial,Helvetica,sans-serif;
    font-size:clamp(11px,1.1vw,17px);
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#d7e5ff;
    opacity:0.9;
}

#login{
    position:fixed;
    inset:0;
    z-index:99;

    display:none;
    align-items:center;
    justify-content:center;

    background:#000;
}

.box{
    width:min(350px,90vw);
    background:#090909;
    border:1px solid #252525;
    padding:22px;
    color:#fff;
    font-family:Arial,sans-serif;
}

.box h2{
    margin:0 0 15px;
}

.box input{
    width:100%;
    height:42px;

    margin-bottom:8px;

    background:#000;
    color:#fff;

    border:1px solid #303030;

    padding:0 10px;
}

.box button{
    width:100%;
    height:42px;

    border:0;
    background:#fff;
    color:#000;

    font-weight:bold;
}

#error{
    color:#e55;
    font-size:11px;
    margin-top:8px;
}

</style>
</head>

<body>

<div id="login">

    <div class="box">

        <h2>ACCESO</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Correo"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Contraseña"
        >

        <button id="loginBtn">
            ENTRAR
        </button>

        <div id="error"></div>

    </div>

</div>

<div id="card">

    <div class="badge" id="badge"><img id="logo" alt="Logo del patrocinador"><span id="logoText">ASTRA</span></div>

    <div class="body">

        <div class="name" id="name"></div>

        <div class="cargo" id="cargo"></div>

    </div>

</div>

<script>
(() => {

const {auth,db}=window.ASTRA;
const ref=window.ASTRA.createRef("rotulo");

const $=id=>
    document.getElementById(id);

let listening=false;
let wasVisible=false;

function render(data){

    const logoScale=Number(data.logoScale)||1;
    $("badge").style.setProperty("--logo-scale",String(logoScale));
    $("logo").src=data.logo||"";
    $("logo").style.display=data.logo?"block":"none";
    $("logoText").style.display=data.logo?"none":"block";

    $("name").textContent=
        data.name||"";

    $("cargo").textContent=
        data.cargo||"";

    $("card").style.borderLeftColor=
        data.color1||"#4e7fff";

    $("card").style.background=
        data.color2||"#111";

    $("name").style.fontFamily=
        (data.font||"Arial")+
        ",Helvetica,sans-serif";

    $("cargo").style.fontFamily=
        (data.font||"Arial")+
        ",Helvetica,sans-serif";

    const visible=!!data.visible;

    if(visible && !wasVisible){

        $("card").classList.remove("show");

        void $("card").offsetWidth;

        requestAnimationFrame(()=>{
            $("card").classList.add("show");
        });

    }

    if(!visible){

        $("card").classList.remove("show");

    }

    wasVisible=visible;

}

function startListen(){

    if(listening)return;

    listening=true;

    ref.on(
        "value",
        snap=>{
            render(snap.val()||{});
        },
        err=>{
            console.error(err);
        }
    );

}

$("login").style.display="none";
auth.signInAnonymously().then(startListen).catch(e=>console.error("Firebase auth:",e.code||e.message));

})();
</script>

</body>
</html>
