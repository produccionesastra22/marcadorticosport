<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
.card{position:absolute;left:5vw;bottom:8vh;display:flex;align-items:stretch;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);backdrop-filter:blur(10px);transform:translateX(-110%);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
.card.show{transform:translateX(0);opacity:1}
.bar{width:8px}
.body{padding:14px 26px 14px 18px}
.name{font-size:clamp(18px,2.2vw,32px);font-weight:900;text-transform:uppercase;color:#fff;line-height:1.1}
.cargo{font-size:clamp(11px,1.1vw,16px);font-weight:600;opacity:.85;margin-top:4px;color:#fff}
#login{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:#090d14}
#login .box{width:min(360px,90vw);padding:24px;border:1px solid #273044;border-radius:18px;background:#121824;color:#fff}
#login input{width:100%;height:42px;margin:5px 0;background:#090d14;border:1px solid #303a4e;color:#fff;border-radius:10px;padding:0 11px}
#login button{width:100%;height:42px;margin-top:8px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-weight:800}
</style></head><body>
<div id="login"><div class="box"><h1 style="font-size:18px;margin:0 0 8px">Acceso al overlay</h1><input id="loginEmail" type="email" placeholder="Correo"><input id="loginPassword" type="password" placeholder="Contraseña"><button id="loginBtn">Entrar</button></div></div>
<div class="card" id="card"><div class="bar" id="bar"></div><div class="body" id="body"><div class="name" id="name"></div><div class="cargo" id="cargo"></div></div></div>
<script>
(() => {
  const FIREBASE_CONFIG={apiKey:"AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",authDomain:"astraprods.firebaseapp.com",databaseURL:"https://astraprods-default-rtdb.firebaseio.com",projectId:"astraprods"};
  const params=new URLSearchParams(location.search),matchId=params.get("match")||params.get("uuid")||"default";
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),db=firebase.database(),ref=db.ref("rotulo/"+matchId);
  const $=id=>document.getElementById(id);
  function render(d){
    $("name").textContent=d.name||"";$("cargo").textContent=d.cargo||"";
    $("body").style.fontFamily=(d.font||"Montserrat")+",sans-serif";
    $("bar").style.background=d.color1||"#4e7fff";
    const c2=d.color2||"#0d1119";
    $("body").style.background=`linear-gradient(90deg,${c2}cc,${c2}aa)`;
    const card=$("card");
    if(d.visible){ card.classList.remove("show"); void card.offsetWidth; requestAnimationFrame(()=>card.classList.add("show")); }
    else card.classList.remove("show");
  }
  ref.on("value",snap=>render(snap.val()||{}));
  auth.onAuthStateChanged(u=>{$("login").style.display=u?"none":"flex"});
  $("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPassword").value)}catch(e){alert(e.code||"No se pudo iniciar sesión")}};
})();
</script></body></html>
