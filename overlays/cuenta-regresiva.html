<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/theme.css?v=20260918-4"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="../assets/firebase.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Montserrat,Arial,sans-serif;color:#fff}.countdown{position:absolute;right:5vw;top:5vh;text-align:right;text-transform:uppercase;text-shadow:0 4px 20px #000}.label{font-size:clamp(10px,1vw,16px);letter-spacing:2px;color:#9fc9ed;font-weight:800}.time{font-size:clamp(52px,8vw,120px);font-weight:900;line-height:1;color:#fff;font-variant-numeric:tabular-nums}.state{font-size:10px;color:#ffcf67;letter-spacing:1px}.login{display:none}</style></head><body><div class="countdown"><div class="label">Próximo momento al aire</div><div class="time" id="time">00:00</div><div class="state" id="state">LISTO</div></div><div class="login" id="login"></div><script>(()=>{const {auth}=window.ASTRA,ref=window.ASTRA.createMatchRef("production"),$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");let data={countdown:{}};function draw(){const c=data.countdown||{},s=c.active?Math.max(0,(Number(c.baseSeconds)||0)-Math.floor((Date.now()-(Number(c.startedAt)||0))/1000)):Number(c.baseSeconds)||0;$("time").textContent=pad(Math.floor(s/60))+":"+pad(s%60);$("state").textContent=c.active?"EN MARCHA":s?"EN PAUSA":"LISTO"}auth.signInAnonymously().then(()=>ref.on("value",s=>{data=s.val()||data;draw()})).catch(()=>{$("state").textContent="SIN CONEXIÓN"});setInterval(draw,500)})();</script></body></html>
