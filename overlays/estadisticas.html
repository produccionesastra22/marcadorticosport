<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/theme.css?v=20260918-4"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="../assets/firebase.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Montserrat,Arial,sans-serif;color:#fff}.stats{position:absolute;left:5vw;right:5vw;bottom:5vh;display:flex;justify-content:center;gap:8px}.stat{min-width:115px;padding:9px 14px;text-align:center;background:rgba(7,16,27,.9);border:1px solid rgba(113,181,235,.4);border-radius:7px;text-transform:uppercase}.stat b{display:block;font-size:clamp(18px,2.5vw,34px);line-height:1}.stat span{font-size:8px;color:#9eb5c9;letter-spacing:1px}.login{display:none}</style></head><body><div class="stats"><div class="stat"><b id="shots1">0</b><span>Tiros local</span></div><div class="stat"><b id="shots2">0</b><span>Tiros visitante</span></div><div class="stat"><b id="corners1">0</b><span>Corners local</span></div><div class="stat"><b id="corners2">0</b><span>Corners visitante</span></div></div><div class="login" id="login"></div><script>(()=>{const {auth}=window.ASTRA,ref=window.ASTRA.createMatchRef("production/stats"),$=id=>document.getElementById(id);function draw(s){["shots1","shots2","corners1","corners2"].forEach(k=>$(k).textContent=Number(s[k])||0)}auth.signInAnonymously().then(()=>ref.on("value",s=>draw(s.val()||{}))).catch(()=>{})})();</script></body></html>
