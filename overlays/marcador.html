<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font-family:Montserrat,Arial,sans-serif;color:#fff}
#stage{position:relative;width:100vw;height:100vh;background:transparent!important}
.stage-el{position:absolute;white-space:nowrap;font-family:Montserrat,Arial,sans-serif;font-weight:800;text-transform:uppercase;line-height:1}
.stage-el img{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="stage">
  <div class="stage-el" id="el_name1">LOCAL</div>
  <div class="stage-el" id="el_name2">VISITANTE</div>
  <div class="stage-el" id="el_score1">0</div>
  <div class="stage-el" id="el_score2">0</div>
  <div class="stage-el" id="el_clock">00:00</div>
  <div class="stage-el" id="el_extra"></div>
  <div class="stage-el" id="el_logo1"><img id="img_logo1"></div>
  <div class="stage-el" id="el_logo2"><img id="img_logo2"></div>
</div>
<script>
// ASTRA · Firebase bootstrap
(() => {
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",
    authDomain: "astraprods.firebaseapp.com",
    databaseURL: "https://astraprods-default-rtdb.firebaseio.com",
    projectId: "astraprods"
  };

  const defaults = {
    team1Name: "LOCAL", team2Name: "VISITANTE",
    team1Logo: "", team2Logo: "", score1: 0, score2: 0,
    timer: {phase:"first",baseSeconds:0,running:false,startedAt:0,extraMinutes:0,extraActive:false},
    penalties: {active:false,team1Name:"LOCAL",team2Name:"VISITANTE",kicks1:[null,null,null,null,null],kicks2:[null,null,null,null,null],visibleKicks:5},
    layout: {
      name1:{x:10,y:38,w:30,h:8,fontSize:3,color:"#ffffff",fontWeight:800,align:"left"},
      name2:{x:60,y:38,w:30,h:8,fontSize:3,color:"#ffffff",fontWeight:800,align:"right"},
      score1:{x:28,y:48,w:15,h:12,fontSize:6,color:"#ffffff",fontWeight:900,align:"center"},
      score2:{x:57,y:48,w:15,h:12,fontSize:6,color:"#ffffff",fontWeight:900,align:"center"},
      clock:{x:40,y:20,w:20,h:10,fontSize:5,color:"#ffffff",fontWeight:900,align:"center"},
      extra:{x:46,y:30,w:8,h:6,fontSize:2.2,color:"#ffffff",fontWeight:800,align:"center"},
      logo1:{x:5,y:35,w:12,h:12,fontSize:1,color:"#ffffff",fontWeight:700,align:"center"},
      logo2:{x:83,y:35,w:12,h:12,fontSize:1,color:"#ffffff",fontWeight:700,align:"center"}
    }
  };

  const params = new URLSearchParams(location.search);
  const matchId = params.get("match") || "default";

  if (!window.firebase) throw new Error("Firebase SDK no cargado.");
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);

  const auth = firebase.auth();
  const db = firebase.database();
  const ref = db.ref("marcadorSimple/" + matchId);
  let state = JSON.parse(JSON.stringify(defaults));
  let offset = 0;

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  const serverNow = () => Date.now() + offset;

  function seconds() {
    if (!state.timer.running) return Math.max(0, Number(state.timer.baseSeconds)||0);
    return Math.max(0,
      (Number(state.timer.baseSeconds)||0) +
      Math.floor((serverNow()-(Number(state.timer.startedAt)||0))/1000)
    );
  }
  const fmt = s => {
    s = Math.max(0, Math.floor(s));
    return `${pad(Math.floor(s/60))}:${pad(s%60)}`;
  };
  const save = patch => ref.update(patch);

  ref.on("value", snap => {
    const d = snap.val() || {};
    state = {
      ...defaults, ...d,
      timer:{...defaults.timer,...(d.timer||{})},
      penalties:{...defaults.penalties,...(d.penalties||{})},
      layout:{...defaults.layout,...(d.layout||{})}
    };
    if (window.renderApp) window.renderApp();
  });

  db.ref(".info/serverTimeOffset").on("value", s => offset = Number(s.val()||0));

  window.ASTRA = {
    $, db, auth, ref, defaults, save, seconds, fmt, serverNow,
    getState: () => state,
    get offset(){ return offset; }
  };
})();

</script>
<script>
const $=window.ASTRA.$, defaults=window.ASTRA.defaults, fmt=window.ASTRA.fmt, seconds=window.ASTRA.seconds;
const layoutDefaults = defaults.layout;
function applyLayout(){
  const state=window.ASTRA.getState();
  const layout={...layoutDefaults,...(state.layout||{})};
  Object.keys(layoutDefaults).forEach(k=>{
    const el=$("el_"+k); if(!el)return;
    const s={...layoutDefaults[k],...(layout[k]||{})};
    el.style.left=s.x+"%"; el.style.top=s.y+"%";
    el.style.width=s.w+"%"; el.style.height=s.h+"%";
    el.style.fontSize=s.fontSize+"vw"; el.style.color=s.color;
    el.style.fontWeight=s.fontWeight; el.style.textAlign=s.align;
    el.style.display=(k.startsWith("logo") && !(k==="logo1"?state.team1Logo:state.team2Logo))?"none":"block";
  });
}
function renderApp(){
  const state=window.ASTRA.getState();
  $("el_name1").textContent=state.team1Name||"LOCAL";
  $("el_name2").textContent=state.team2Name||"VISITANTE";
  $("el_score1").textContent=state.score1||0;
  $("el_score2").textContent=state.score2||0;
  $("el_clock").textContent=fmt(seconds());
  const ex=Number(state.timer.extraMinutes||0);
  $("el_extra").textContent=state.timer.extraActive&&ex>0?`+${ex}`:"";
  $("el_extra").style.display=state.timer.extraActive&&ex>0?"block":"none";
  $("img_logo1").src=state.team1Logo||"";
  $("img_logo2").src=state.team2Logo||"";
  applyLayout();
}
setInterval(()=>{renderApp()},1000);
renderApp();
</script>
</body>
</html>
