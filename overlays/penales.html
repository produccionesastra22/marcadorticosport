<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../assets/firebase.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}body{font-family:Inter,Arial,sans-serif;color:#fff}.board{position:absolute;left:5vw;right:5vw;top:7vh;bottom:7vh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-shadow:0 3px 12px #000b}.eyebrow{text-align:center;font-size:clamp(10px,1vw,18px);letter-spacing:3px;font-weight:900;opacity:.78}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:3vw;align-items:center}.team{text-align:center;min-width:0}.name{font-size:clamp(22px,3.4vw,60px);font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:clamp(58px,8vw,120px);font-weight:900;line-height:.9;margin-top:5px}.dash{font-size:clamp(18px,2vw,30px);font-weight:900;opacity:.4}.series{display:flex;justify-content:center;gap:clamp(5px,.7vw,12px);margin-top:12px;min-height:clamp(28px,3vw,52px)}.kick{width:clamp(27px,2.7vw,48px);height:clamp(27px,2.7vw,48px);border-radius:50%;border:2px solid rgba(255,255,255,.28);display:grid;place-items:center;background:rgba(0,0,0,.18);font-size:clamp(12px,1.2vw,21px);font-weight:900}.kick.goal{background:rgba(45,190,120,.32);border-color:#35d07f}.kick.miss{background:rgba(235,75,100,.25);border-color:#ff6378}.kick.pending{opacity:.35}.current{outline:2px solid #fff;outline-offset:3px;opacity:1}.turn{text-align:center;font-size:clamp(10px,1vw,17px);font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.88}.result{text-align:center;font-size:clamp(9px,.9vw,15px);opacity:.58;letter-spacing:1.5px;text-transform:uppercase}
</style></head><body>
<div class="board"><div class="eyebrow">TANDA DE PENALES</div><div class="scoreline"><div class="team"><div class="name" id="n1">LOCAL</div><div class="score" id="s1">0</div><div class="series" id="k1"></div></div><div class="dash">—</div><div class="team"><div class="name" id="n2">VISITANTE</div><div class="score" id="s2">0</div><div class="series" id="k2"></div></div></div><div class="turn" id="turn">SIGUIENTE · LOCAL</div><div class="result" id="result">SERIE DE 5</div></div>
<script>
function nextTurn(p){const a=p.kicks1||[],b=p.kicks2||[],total=a.filter(Boolean).length+b.filter(Boolean).length;return {total,target:total%2===0?0:1,round:Math.floor(total/2)+1}}
function renderApp(){const s=window.ASTRA.getState(),p={...window.ASTRA.defaults.penalties,...(s.penalties||{})},v=Math.max(5,Math.min(10,Number(p.visibleKicks)||5)),a=Array.isArray(p.kicks1)?p.kicks1:[],b=Array.isArray(p.kicks2)?p.kicks2:[],n=nextTurn(p);$("n1").textContent=p.team1Name||s.team1Name||'LOCAL';$("n2").textContent=p.team2Name||s.team2Name||'VISITANTE';$("s1").textContent=a.filter(x=>x==='goal').length;$("s2").textContent=b.filter(x=>x==='goal').length;draw('k1',a,0,v,n);draw('k2',b,1,v,n);const name=n.target===0?$("n1").textContent:$("n2").textContent;$("turn").textContent=n.total<10?`SIGUIENTE · ${name} · LANZAMIENTO ${n.round}`:'MUERTE SÚBITA';$("result").textContent=`${a.filter(Boolean).length+b.filter(Boolean).length} LANZAMIENTOS · SERIE ${v}`}
function draw(id,arr,team,v,n){$(id).innerHTML=Array.from({length:v},(_,i)=>{const x=arr[i],cl=x==='goal'?'goal':x==='miss'?'miss':'pending',m=x==='goal'?'✓':x==='miss'?'×':i+1,current=!x&&n.target===team&&n.round===i+1?' current':'';return `<div class="kick ${cl}${current}">${m}</div>`}).join('')}
window.renderApp=renderApp;renderApp();
</script></body></html>
