<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuenta regresiva</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../assets/firebase.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Montserrat,Arial,sans-serif;color:#fff}.countdown{position:absolute;right:5vw;top:5vh;text-align:right;text-transform:uppercase;text-shadow:0 4px 20px rgba(0,0,0,.44)}.countdown-box{display:inline-flex;flex-direction:column;align-items:flex-end;padding:14px 18px 12px;border-radius:16px;background:rgba(10,18,28,.78);border:1px solid rgba(118,170,255,.35);box-shadow:0 18px 40px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.06)}.label{font-size:clamp(10px,1vw,16px);letter-spacing:2px;color:#9fc9ed;font-weight:800}.time{font-size:clamp(52px,8vw,120px);font-weight:900;line-height:1;color:#fff;font-variant-numeric:tabular-nums}.state{font-size:10px;color:#ffcf67;letter-spacing:1px}
</style>
</head>
<body>
<div class="countdown"><div class="countdown-box"><div class="label">Próximo momento al aire</div><div class="time" id="time">00:00</div><div class="state" id="state">CONECTANDO</div></div></div>
<script>
(() => {
  const time = document.getElementById('time');
  const state = document.getElementById('state');
  const { auth, createMatchRef } = window.ASTRA;
  const ref = createMatchRef('production/countdown');
  let countdown = { active: false, baseSeconds: 0, startedAt: 0 };

  const format = (value) => {
    const seconds = Math.max(0, Math.floor(Number(value) || 0));
    return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  };

  const draw = () => {
    const base = Number(countdown.baseSeconds) || 0;
    const remaining = countdown.active
      ? Math.max(0, base - Math.floor((Date.now() - (Number(countdown.startedAt) || 0)) / 1000))
      : base;
    time.textContent = format(remaining);
    state.textContent = countdown.active ? (remaining ? 'EN MARCHA' : 'FINALIZADO') : (remaining ? 'EN PAUSA' : 'LISTO');
  };

  auth.signInAnonymously()
    .then(() => ref.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      countdown = {
        active: !!data.active,
        baseSeconds: Number(data.baseSeconds) || 0,
        startedAt: Number(data.startedAt) || 0
      };
      draw();
    }))
    .catch(() => { state.textContent = 'SIN CONEXIÓN'; });

  setInterval(draw, 250);
})();
</script>
</body>
</html>
