<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRA · Noticias</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b11;color:#f7f9fc;font-family:Inter,Arial,sans-serif}
.wrap{width:min(760px,94vw);margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.eyebrow{font-size:9px;letter-spacing:2px;color:#7395df;font-weight:900}.title{font-size:28px;font-weight:900;margin-top:5px}.sub{font-size:11px;color:#778399;margin-top:5px}
.card{background:#10151e;border:1px solid #252e3d;border-radius:16px;padding:16px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;font-size:9px;color:#7e8ba0;margin-bottom:5px}input,select{width:100%;height:40px;background:#090d14;color:#fff;border:1px solid #2b3545;border-radius:9px;padding:0 10px;font:600 12px Inter}textarea{width:100%;min-height:90px;resize:vertical;background:#090d14;color:#fff;border:1px solid #2b3545;border-radius:9px;padding:10px;font:700 18px/1.25 Inter}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4e7fff;box-shadow:0 0 0 2px #4e7fff18}.wide{grid-column:1/-1}
.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}button{height:42px;border:0;border-radius:10px;background:#4e7fff;color:#fff;font-weight:900;cursor:pointer;padding:0 13px}button.secondary{background:#1a2130;color:#dce4f1}button.danger{background:#702d3d}
.preview{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 78% 25%,#214878 0,transparent 28%),linear-gradient(135deg,#0b1725,#101722 55%,#080d14);border:1px solid #2c4056;border-radius:12px;overflow:hidden;margin-top:10px}.preview:before{content:"NEWSROOM · LIVE GRAPHICS";position:absolute;top:16%;right:7%;font-size:8px;letter-spacing:2px;color:#6f8eaa;opacity:.7}.preview-card{position:absolute;left:5%;right:5%;bottom:10%;display:grid;grid-template-columns:76px 1fr;background:rgba(8,16,27,.96);color:#f6f9fc;border:1px solid rgba(130,170,205,.35);border-radius:8px;overflow:hidden;box-shadow:0 16px 35px #0008}.bar{grid-column:1/-1;height:6px;background:linear-gradient(90deg,#174ea6 0 72%,#d71920 72% 100%)}.preview-brand{display:flex;align-items:center;justify-content:center;padding:10px;background:#0c2848;border-right:1px solid #2c5276}.preview-brand img{display:none;max-width:48px;max-height:48px;object-fit:contain;transform:scale(var(--logo-scale,1));transform-origin:center;transition:transform .15s ease}.preview-brand span{font-size:10px;font-weight:900;letter-spacing:1px;text-align:center}.preview-body{padding:12px 16px}.preview-cat{font-size:9px;font-weight:900;letter-spacing:1.6px;color:#7eb9ff;text-transform:uppercase}.preview-title{font-size:clamp(16px,2.2vw,28px);font-weight:900;line-height:1.05;margin-top:4px}.preview-sub{font-size:11px;color:#aab9c9;margin-top:5px}
.status{font-size:10px;color:#8d99ab;margin-top:8px}.login{position:fixed;inset:0;background:#06090eec;display:none;place-items:center;padding:18px;z-index:20}.loginbox{width:min(360px,100%);background:#111721;border:1px solid #293344;border-radius:18px;padding:20px}.loginbox input{margin:5px 0}.loginbox button{width:100%;margin-top:8px}.error{font-size:11px;color:#ff7184;margin-top:8px;min-height:15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.row{flex-wrap:wrap}}
</style>
<link rel="stylesheet" href="assets/theme.css?v=20260918">
</head>
<body class="has-module-rail">
<aside class="module-rail" aria-label="Módulos ASTRA">
<a class="rail-brand" data-route="control.html" href="#" title="Control ASTRA">A</a><a data-route="control.html" href="#" title="Marcador">⚽</a><a data-route="penales.html" href="#" title="Penales">🥅</a><a data-route="alineaciones.html" href="#" title="Alineaciones">🧾</a><a data-route="rotulo.html" href="#" title="Rótulo">🏷️</a><a class="active" data-route="noticias.html" href="#" title="Noticias">📰</a><span class="rail-spacer"></span>
</aside><script>const moduleMatch=encodeURIComponent(new URLSearchParams(location.search).get("match")||"default");document.querySelectorAll(".module-rail [data-route]").forEach(a=>a.href=a.dataset.route+"?match="+moduleMatch);</script>
<main class="wrap">
<header class="top"><div><div class="eyebrow">ASTRA PRODS · NEWS GRAPHICS</div><div class="title">Noticias / Lower Third</div><div class="sub">Titulares limpios para noticias, deportes, entrevistas y streaming.</div></div><button class="secondary" id="back">← Control</button></header>
<section class="card">
<div class="grid">
<div class="wide"><label>ANTETÍTULO / CATEGORÍA</label><input id="category" placeholder="ÚLTIMA HORA · DEPORTES"></div>
<div class="wide"><label>TITULAR</label><textarea id="headline" placeholder="Escribí aquí el título de la noticia"></textarea></div>
<div class="wide"><label>BAJADA / SUBTÍTULO</label><input id="subtitle" placeholder="Información adicional o contexto"></div>
<div class="wide"><label>LOGO DEL CANAL · URL DIRECTA</label><input id="logo" type="url" placeholder="https://tusitio.com/logo.png"></div>
<div class="wide"><label>TAMAÑO DEL LOGO</label><input id="logoScale" type="range" min="0.5" max="1.8" step="0.05" value="1"></div>
<div><label>AZUL</label><input id="blue" type="color" value="#174ea6"></div>
<div><label>ROJO</label><input id="red" type="color" value="#d71920"></div>
</div>
<div class="preview" id="preview"><div class="preview-card"><div class="bar" id="pbar"></div><div class="preview-brand"><img id="plogo"><span id="plogoText">ASTRA<br>NEWS</span></div><div class="preview-body"><div class="preview-cat" id="pcat">ÚLTIMA HORA · DEPORTES</div><div class="preview-title" id="ptitle">Título de la noticia</div><div class="preview-sub" id="psub">Información adicional o contexto</div></div></div></div>
<div class="status" id="status">Esperando conexión...</div>
</section>
<div class="row"><button id="show">MOSTRAR EN AIRE</button><button class="secondary" id="hide">OCULTAR</button></div>
<div class="row"><button class="secondary" id="overlay">ABRIR OVERLAY</button><button class="secondary" id="copy">COPIAR LINK OBS</button></div>
<input id="link" readonly style="width:100%;height:38px;margin-top:8px;background:#090d14;color:#9aa7ba;border:1px solid #252e3d;border-radius:9px;padding:0 10px">
</main>
<div class="login" id="login"><div class="loginbox"><h2>ACCESO</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn">ENTRAR</button><div class="error" id="error"></div></div></div>
<script>
(() => {
const FIREBASE_CONFIG={apiKey:"AIzaSyA71rh4uzcNOueb48-FegayRueExfmI9tw",authDomain:"astraprods.firebaseapp.com",databaseURL:"https://astraprods-default-rtdb.firebaseio.com",projectId:"astraprods"};
if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.database(),ref=db.ref("noticiasLowerThird");
const defaults={category:"ÚLTIMA HORA · DEPORTES",headline:"",subtitle:"",logo:"",logoScale:1,blue:"#174ea6",red:"#d71920",visible:false,updatedAt:0};
let state={...defaults},listening=false;const $=id=>document.getElementById(id);
function save(patch){return ref.update({...patch,updatedAt:firebase.database.ServerValue.TIMESTAMP}).catch(e=>{console.error(e);$("status").textContent="Error de Firebase: "+(e.code||"lectura/escritura rechazada");throw e})}
function render(){
$("category").value=state.category||"";$("headline").value=state.headline||"";$("subtitle").value=state.subtitle||"";$("logo").value=state.logo||"";$("logoScale").value=String(state.logoScale ?? 1);
$("blue").value=state.blue||defaults.blue;$("red").value=state.red||defaults.red;
$("pcat").textContent=state.category||"ÚLTIMA HORA · DEPORTES";$("ptitle").textContent=state.headline||"Título de la noticia";$("psub").textContent=state.subtitle||"Información adicional o contexto";
	const scale=Number(state.logoScale)||1;$("pbar").style.background=`linear-gradient(90deg,${state.blue||defaults.blue} 0 72%,${state.red||defaults.red} 72% 100%)`;$("plogo").src=state.logo||"";$("plogo").style.display=state.logo?"block":"none";$("plogo").style.setProperty("--logo-scale",String(scale));$("plogo").style.transform=`scale(${scale})`;$("plogoText").style.display=state.logo?"none":"block";
$("show").textContent=state.visible?"● EN AIRE":"MOSTRAR EN AIRE";$("status").textContent=state.visible?"● Lower third EN AIRE":"● Lower third oculto";
}
function listen(){if(listening)return;listening=true;ref.on("value",snap=>{state={...defaults,...(snap.val()||{})};render()},e=>{$("status").textContent="Firebase: "+(e.code||e.message)})}
["category","headline","subtitle","logo","logoScale","blue","red"].forEach(id=>$(id).addEventListener("change",e=>{const value=id==="logoScale"?Number(e.target.value):e.target.value;save({[id]:value});}));
$("logoScale").addEventListener("input",e=>{$("plogo").style.transform=`scale(${Number(e.target.value)||1})`;});
$("show").onclick=()=>save({visible:true});$("hide").onclick=()=>save({visible:false});
function overlayUrl(){return new URL("overlays/noticias.html",location.href).href}
$("link").value=overlayUrl();$("overlay").onclick=()=>window.open(overlayUrl(),"_blank");$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("link").value);$("status").textContent="Link copiado ✓"}catch(e){$("link").select();document.execCommand("copy")}};
$("back").onclick=()=>location.href="control.html?match="+encodeURIComponent(new URLSearchParams(location.search).get("match")||"default");
$("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){$("error").textContent=e.code||"No se pudo iniciar sesión"}};
auth.onAuthStateChanged(u=>{$("login").style.display=u?"none":"grid";if(u)listen()});
})();
</script>
</body></html>
